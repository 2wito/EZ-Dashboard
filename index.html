<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="(K) NOC (K) OUT — a single-file, zero-framework NOC team operations dashboard.">
<title>(K) NOC (K) OUT — Ops Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%2322d3ee' font-family='Arial' font-weight='bold'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== 1. Design Tokens — Liquid Glass ===== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, "Cascadia Code", Consolas, monospace;
  --ok: #30d158;
  --warn: #ffd60a;
  --bad: #ff453a;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 9999px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: .2s;
  --sidebar-w: 272px;
  --blur: 20px;
  --glass-filter: blur(var(--blur)) saturate(180%);
  --glass-filter-hover: blur(25px) saturate(190%);
  --term-bg: rgba(8, 10, 16, .9);
  --term-text: #c8f7d4;
}
/* Surface tokens live on body so theme + light-mode classes (also on body) can override them */
body {
  --bg: #05060c;
  --text: rgba(255, 255, 255, .94);
  --muted: rgba(235, 235, 245, .58);
  --glass: rgba(255, 255, 255, .05);
  --glass-strong: rgba(30, 32, 44, .62);
  --glass-border: rgba(255, 255, 255, .12);
  --surface: var(--glass);
  --surface-2: rgba(255, 255, 255, .06);
  --surface-3: rgba(255, 255, 255, .11);
  --border: rgba(255, 255, 255, .12);
  --border-strong: rgba(255, 255, 255, .22);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, .08);
  --shadow: 0 8px 32px 0 rgba(0, 0, 0, .36), var(--highlight);
  --shadow-hover: 0 14px 40px 0 rgba(0, 0, 0, .44), inset 0 1px 0 rgba(255, 255, 255, .14);
  --sheen: rgba(255, 255, 255, .09);
  --option-bg: #1c1d26;
  --on-accent: #ffffff;
  --glow: 0 0 22px rgba(var(--accent-rgb), .45);
  --glow-soft: 0 0 0 4px rgba(var(--accent-rgb), .18);
}

/* ===== 1b. Themes (body.theme-*) — accent + ambient light colours ===== */
body.theme-liquid { --accent: #0a84ff; --accent-2: #bf5af2; --accent-rgb: 10,132,255;  --glow-a: #0a84ff; --glow-b: #bf5af2; --glow-c: #64d2ff; }
body.theme-aurora { --accent: #30d158; --accent-2: #64d2ff; --accent-rgb: 48,209,88;   --glow-a: #30d158; --glow-b: #64d2ff; --glow-c: #5e5ce6; --on-accent: #032b10; }
body.theme-sunset { --accent: #ff9f0a; --accent-2: #ff375f; --accent-rgb: 255,159,10;  --glow-a: #ff9f0a; --glow-b: #ff375f; --glow-c: #bf5af2; --on-accent: #2b1700; }
body.theme-indigo { --accent: #5e5ce6; --accent-2: #ff2d55; --accent-rgb: 94,92,230;   --glow-a: #5e5ce6; --glow-b: #ff2d55; --glow-c: #0a84ff; }

/* ===== 2. Glass Light Mode (frosted white layers, vibrant accents) ===== */
body.light-mode {
  --bg: #eef1f8;
  --text: rgba(0, 0, 0, .88);
  --muted: rgba(60, 60, 67, .64);
  --glass: rgba(255, 255, 255, .55);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-border: rgba(255, 255, 255, .75);
  --surface-2: rgba(255, 255, 255, .55);
  --surface-3: rgba(0, 0, 0, .06);
  --border: rgba(0, 0, 0, .09);
  --border-strong: rgba(0, 0, 0, .16);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, .9);
  --shadow: 0 8px 32px 0 rgba(31, 38, 135, .12), var(--highlight);
  --shadow-hover: 0 14px 40px 0 rgba(31, 38, 135, .18), inset 0 1px 0 #fff;
  --sheen: rgba(255, 255, 255, .55);
  --option-bg: #ffffff;
  --on-accent: #ffffff;
  --ok: #248a3d;
  --warn: #a05a00;
  --bad: #d70015;
}
body.light-mode.theme-liquid { --accent: #007aff; --accent-rgb: 0,122,255; }
body.light-mode.theme-aurora { --accent: #248a3d; --accent-rgb: 36,138,61; }
body.light-mode.theme-sunset { --accent: #c93400; --accent-rgb: 201,52,0; }
body.light-mode.theme-indigo { --accent: #5856d6; --accent-rgb: 88,86,214; }
body.light-mode .term { --term-bg: #0d1220; }
body.light-mode::before { opacity: .55; }

/* ===== 3. Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: 14.5px; line-height: 1.5; letter-spacing: -.003em;
  color: var(--text); background: var(--bg);
  transition: background-color .4s var(--ease), color var(--dur) var(--ease);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
/* Ambient light glows that sit underneath every glass layer */
body::before {
  content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 18% 22%, color-mix(in srgb, var(--glow-a) 45%, transparent), transparent 62%),
    radial-gradient(34vmax 34vmax at 86% 14%, color-mix(in srgb, var(--glow-b) 36%, transparent), transparent 62%),
    radial-gradient(44vmax 44vmax at 62% 96%, color-mix(in srgb, var(--glow-c) 30%, transparent), transparent 62%);
  filter: blur(40px) saturate(140%);
  animation: drift 30s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(3vmax, -2vmax, 0) scale(1.08); } }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -.02em; font-weight: 700; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; outline: none;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
}
input:focus, select:focus, textarea:focus { border-color: rgba(var(--accent-rgb), .7); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .18); background: var(--surface-3); }
select option { background: var(--option-bg); color: var(--text); }
textarea { resize: vertical; }
::placeholder { color: var(--muted); opacity: .8; }
:focus-visible { outline: 2px solid rgba(var(--accent-rgb), .9); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(var(--accent-rgb), .6); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd {
  font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 6px;
  background: var(--surface-3); border: 1px solid var(--border); color: var(--muted);
}

/* ===== 3b. Glass Material (shared by every panel) ===== */
.sidebar, .card, .clocks, .hero, .stat, .tpl, .link-tile, .term, .topbar, .palette, .toast, .scratch {
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-filter);
  backdrop-filter: var(--glass-filter);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
}
.stat, .tpl, .link-tile, .g-item {
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease),
              -webkit-backdrop-filter var(--dur) var(--ease), backdrop-filter var(--dur) var(--ease), opacity .2s, filter .2s;
}
.stat:hover, .tpl:hover, .link-tile:hover {
  transform: translateY(-2px);
  -webkit-backdrop-filter: var(--glass-filter-hover);
  backdrop-filter: var(--glass-filter-hover);
  box-shadow: var(--shadow-hover);
  border-color: var(--border-strong);
}

/* ===== 4. Layout: Floating Glass Sidebar + Main ===== */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 12px; height: calc(100vh - 24px); margin: 12px 0 12px 12px; overflow-y: auto;
  display: flex; flex-direction: column; padding: 18px 12px; z-index: 40; border-radius: 24px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
  font-family: var(--font-display); font-weight: 800; color: var(--on-accent);
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  box-shadow: var(--glow), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.15; letter-spacing: -.02em; }
.brand-sub { font-size: 11px; color: var(--muted); }
.nav-group-label { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); padding: 14px 12px 6px; }
.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; background: none;
  border-radius: var(--radius-sm); color: var(--muted); text-align: left; position: relative;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn:active { transform: scale(.98); }
.nav-btn.active { background: rgba(var(--accent-rgb), .16); color: var(--text); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .22); }
.nav-btn.active::before {
  content: ""; position: absolute; left: 3px; top: 50%; height: 16px; width: 3px; border-radius: 3px; transform: translateY(-50%);
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
.nav-ico { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
.nav-ico svg { width: 18px; height: 18px; }
.nav-btn.active .nav-ico { color: var(--accent); }
.nav-label { flex: 1; font-weight: 500; }
.badge {
  min-width: 22px; padding: 1px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; text-align: center;
  background: var(--surface-3); color: var(--muted);
}
.badge.hot { background: rgba(255, 69, 58, .18); color: var(--bad); }
.badge.accent { background: rgba(var(--accent-rgb), .18); color: var(--accent); }
.sidebar-foot { margin-top: auto; padding-top: 16px; display: grid; gap: 8px; }
.theme-row { display: flex; gap: 8px; align-items: center; }
.theme-row select { flex: 1; padding: 7px 12px; border-radius: var(--radius-pill); }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius-pill);
  min-width: 34px; height: 34px; padding: 0 10px; line-height: 1;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-3); transform: translateY(-1px); }
.palette-hint {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 8px 14px; width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface-2); color: var(--muted); font-size: 12.5px;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.palette-hint:hover { background: var(--surface-3); color: var(--text); }

/* Mobile drawer backdrop — must never be a grid item, or it steals the main column */
.scrim { position: fixed; inset: 0; z-index: 35; display: none; background: rgba(0, 0, 0, .35); }
.scrim.open { display: block; }
.main { min-width: 0; padding: 24px 28px 80px; }
.topbar { display: none; }

/* ===== 5. Glass World Clocks Bar ===== */
.clocks {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 6px; margin-bottom: 18px; border-radius: var(--radius);
}
@media (max-width: 1100px) { .clocks { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.clock {
  min-width: 0; padding: 9px 14px; display: flex; flex-direction: column; border-radius: 14px; position: relative;
  transition: background var(--dur) var(--ease);
}
.clock:hover { background: var(--surface-2); }
.clock-label { font-size: 11px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.clock-time { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clock-day { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock-cust { color: var(--accent); font-weight: 600; }
.clock.local { background: rgba(var(--accent-rgb), .14); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .25); }
.clock.local .clock-time { color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; align-self: center; }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.off { background: var(--muted); opacity: .5; }

/* ===== 6. Sections, Glass Cards & Pill Buttons ===== */
.page-section { display: none; animation: fadeUp .35s var(--ease) both; }
.page-section.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
.section-head h2 { font-size: 28px; letter-spacing: -.03em; }
.section-head p { margin: 4px 0 0; color: var(--muted); }
.card { border-radius: var(--radius); padding: 20px; transition: border-color var(--dur) var(--ease); }
.card:hover { border-color: var(--border-strong); }
.card + .card { margin-top: 16px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title h3 { font-size: 17px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); padding: 8px 16px; border-radius: var(--radius-pill);
  font-weight: 500; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { background: var(--surface-3); border-color: var(--border-strong); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.primary {
  background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600;
  box-shadow: 0 6px 18px rgba(var(--accent-rgb), .35), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.btn.primary:hover { filter: brightness(1.08); box-shadow: 0 10px 24px rgba(var(--accent-rgb), .45), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn.danger:hover { border-color: rgba(255, 69, 58, .5); color: var(--bad); background: rgba(255, 69, 58, .1); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius-sm); }

/* ===== 7. Glass Hero ===== */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; padding: 34px 32px 28px; margin-bottom: 18px;
  background:
    radial-gradient(600px 260px at 8% -10%, rgba(var(--accent-rgb), .30), transparent 70%),
    radial-gradient(520px 280px at 100% 115%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 70%),
    var(--glass);
}
.hero::after { /* specular sheen across the glass */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, var(--sheen) 0%, transparent 38%);
}
.hero > * { position: relative; z-index: 1; }
.hero-kicker { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
.hero-title {
  font-size: clamp(32px, 5.2vw, 56px); font-weight: 800; margin: 6px 0 6px; line-height: 1.02; letter-spacing: -.04em;
  background: linear-gradient(100deg, var(--text) 10%, var(--accent) 55%, var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), .3));
  animation: glow 4s ease-in-out infinite;
}
@keyframes glow { 50% { filter: drop-shadow(0 0 16px rgba(var(--accent-rgb), .5)); } }
.hero-greet { font-size: 17px; margin: 0; color: var(--text); opacity: .9; }
.hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-pill); font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { border-radius: var(--radius); padding: 18px; cursor: pointer; }
.stat-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; margin-top: 2px; letter-spacing: -.03em; }
.stat-sub { font-size: 12px; color: var(--muted); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 12px; }
.progress > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s var(--ease); }

/* ===== 8. Tables & Matrix ===== */
.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--surface-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(var(--accent-rgb),.04); }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--ok); background: rgba(52,211,153,.12); }
.status.warn { color: var(--warn); background: rgba(251,191,36,.12); }
.status.bad { color: var(--bad); background: rgba(248,113,113,.12); }
.tier { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--surface-3); }
.tier.Platinum { color: var(--accent); }
.tier.Gold { color: var(--warn); }
.matrix td.cell { text-align: center; padding: 6px; }
.mx {
  width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
  font-size: 14px; font-weight: 700; transition: transform .1s, background .15s;
}
.mx:hover { transform: scale(1.08); }
.mx.s1 { background: rgba(52,211,153,.18); border-color: rgba(52,211,153,.5); color: var(--ok); }
.mx.s2 { background: rgba(248,113,113,.18); border-color: rgba(248,113,113,.5); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .mx { width: 22px; height: 20px; font-size: 11px; cursor: default; }

/* ===== 8b. Customer Table, Matrix Controls ===== */
table.zebra tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 65%, transparent); }
table.zebra tbody tr:hover td { background: rgba(var(--accent-rgb),.08); }
.plat { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); }
.plat::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.plat-android { color: #3ddc84; background: rgba(61,220,132,.1); border-color: rgba(61,220,132,.3); }
.plat-ios { color: var(--text); background: var(--surface-3); }
.plat-aws { color: #ff9900; background: rgba(255,153,0,.1); border-color: rgba(255,153,0,.35); }
.plat-azure { color: #3ea8ff; background: rgba(0,120,212,.12); border-color: rgba(62,168,255,.35); }
.cust-name { letter-spacing: .02em; }
.cust-table th, .cust-table td { padding-left: 10px; padding-right: 10px; }
.ilink { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ilink svg { width: 14px; height: 14px; flex: none; opacity: .8; }
.ilink.mono span { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
.lic { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; opacity: .9; }
.lic.ok { color: var(--ok); } .lic.warn { color: var(--warn); } .lic.bad { color: var(--bad); }
.tam { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.tam-acts { display: inline-flex; gap: 4px; }
.tam-btn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.tam-btn svg { width: 14px; height: 14px; }
.tam-btn:hover, .tam-btn:focus-visible { color: var(--accent); border-color: rgba(var(--accent-rgb),.5); background: rgba(var(--accent-rgb),.1); }

/* ===== 8c. Customer World Map ===== */
.world-map { position: relative; width: 100%; aspect-ratio: 1000 / 394; border-radius: 14px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, rgba(var(--accent-rgb),.10), transparent 70%), var(--surface-2); border: 1px solid var(--border); }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-grid { fill: none; stroke: var(--border); stroke-width: .6; stroke-dasharray: 2 4; }
.map-land { fill: rgba(var(--accent-rgb),.22); stroke: rgba(var(--accent-rgb),.55); stroke-width: .5; stroke-linejoin: round; }
.map-night { fill: rgba(0,0,0,.28); pointer-events: none; }
body.light-mode .map-night { fill: rgba(15,23,42,.12); }
.map-pin { position: absolute; transform: translate(-50%, -50%); width: 14px; height: 14px; padding: 0; border: 0; background: none; cursor: pointer; z-index: 1; }
.map-pin:hover, .map-pin:focus-visible { z-index: 3; }
.pin-dot { --c: var(--accent); position: relative; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 10px var(--c); }
.map-pin .pin-dot { position: absolute; left: 2px; top: 2px; }
.map-pin .pin-dot::before, .map-pin .pin-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); animation: pinPulse 2s var(--ease) infinite; }
.map-pin .pin-dot::after { animation-delay: 1s; }
.pin-dot.ok, .map-pin.ok .pin-dot { --c: var(--ok); }
.pin-dot.warn, .map-pin.warn .pin-dot { --c: var(--warn); }
.pin-dot.bad, .map-pin.bad .pin-dot { --c: var(--bad); }
.map-pin.bad .pin-dot::before, .map-pin.bad .pin-dot::after { animation-duration: 1.1s; }
@keyframes pinPulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(4.2); opacity: 0; } }
.pin-label { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; line-height: 1.15; padding: 3px 8px; border-radius: 8px; white-space: nowrap; text-align: left;
  font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); border: 1px solid var(--border); backdrop-filter: blur(6px); }
.pin-label strong { color: var(--text); font-size: 11.5px; }
.pin-label span { font-variant-numeric: tabular-nums; }
.map-pin.right .pin-label { left: 20px; }
.map-pin.left .pin-label { right: 20px; text-align: right; }
.map-pin:hover .pin-label, .map-pin:focus-visible .pin-label { border-color: var(--c, var(--accent)); color: var(--text); }
.map-legend { margin-top: 12px; }
.map-legend .pin-dot { width: 8px; height: 8px; box-shadow: 0 0 6px var(--c); }
@media (max-width: 760px) {
  .pin-label { display: none; }
  .map-pin:hover .pin-label, .map-pin:focus-visible .pin-label { display: flex; }
}
.vchip { display: inline-block; font-size: 11px; padding: 2px 8px; margin: 1px 0; border-radius: 99px; background: rgba(var(--accent-rgb),.12); color: var(--accent); border: 1px solid rgba(var(--accent-rgb),.25); }
th.mx-head { text-align: center; }
th.mx-head span { display: block; }
.col-all { margin-top: 4px; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); text-transform: none; letter-spacing: 0; }
.col-all:hover { border-color: var(--ok); color: var(--ok); }
.col-all.on { background: rgba(52,211,153,.15); border-color: rgba(52,211,153,.5); color: var(--ok); }
.mx-progress { display: flex; align-items: center; gap: 10px; min-width: 240px; }
.mx-progress .progress { flex: 1; margin: 0; }
.badge.ok { background: rgba(52,211,153,.18); color: var(--ok); }
.grid > .card + .card, .shift-cols > .card + .card { margin-top: 0; }

/* ===== 9. Shift Checklist & Handoff ===== */
.shift-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.shift-col.current { border-color: rgba(var(--accent-rgb),.6); box-shadow: var(--glow-soft), var(--shadow); }
.shift-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.shift-head h3 { font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.now { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-family: var(--font); }
.shift-col .check-item { padding: 8px 10px; font-size: 13px; }
.ci-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ci-stamp { font-size: 11px; color: var(--ok); font-family: var(--font-mono); }
@media (max-width: 1280px) { .shift-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .shift-cols { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab {
  border: 1px solid var(--border); background: var(--surface-2); padding: 7px 13px; border-radius: 999px;
  font-size: 13px; display: inline-flex; gap: 7px; align-items: center;
}
.tab.active { border-color: var(--accent); background: rgba(var(--accent-rgb),.14); }
.tab .now { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.check-item {
  display: flex; gap: 11px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; transition: border-color .15s, opacity .2s;
}
.check-item:hover { border-color: rgba(var(--accent-rgb),.5); }
.check-item input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; cursor: pointer; }
.check-item.done .ci-text { text-decoration: line-through; color: var(--muted); }
.ci-time { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); }
.ci-text { flex: 1; }
.form-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.output {
  width: 100%; min-height: 240px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-2);
}

/* ===== 10. Templates & Cloud Environments ===== */
.tpl {
  text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s; position: relative;
}
.tpl:hover { transform: translateY(-2px); border-color: rgba(var(--accent-rgb),.6); }
.tpl-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tpl-title { font-weight: 600; font-family: var(--font-display); }
.tpl-tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(var(--accent-rgb),.14); color: var(--accent); }
.tpl-body { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: hidden; mask-image: linear-gradient(#000 70%, transparent); -webkit-mask-image: linear-gradient(#000 70%, transparent); }
.tpl-foot { font-size: 11.5px; color: var(--muted); }

.ver-table td[contenteditable] { cursor: text; min-width: 90px; border-radius: 4px; }
.ver-table td[contenteditable]:hover { box-shadow: inset 0 0 0 1px var(--border); }
.ver-table td[contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: rgba(var(--accent-rgb),.07); box-shadow: none; }
.ver-table td[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .45; }

.env-table td.env-flag { position: relative; font-weight: 600; }
.env-table td.env-flag.warn { --flag: var(--warn); color: var(--warn); background: rgba(251,191,36,.10) !important; }
.env-table td.env-flag.bad { --flag: var(--bad); color: var(--bad); background: rgba(248,113,113,.10) !important; }
.env-table td.env-flag::after { content: "!"; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 6px; border-radius: 50%; font-size: 10.5px; font-weight: 800; color: #0b0d14; background: var(--flag); vertical-align: 1px; }
.env-status { appearance: none; -webkit-appearance: none; border: 0; cursor: pointer; padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 600; }
.env-status:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.env-kpis .stat { cursor: default; }
.env-kpi.ok .stat-value { color: var(--ok); }
.env-kpi.warn .stat-value { color: var(--warn); }
.env-kpi.bad .stat-value { color: var(--bad); }
.env-kpi.info .stat-value { color: var(--accent); }
.env-legend { margin-top: 4px; }
.env-flag-key { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.env-flag-key.warn { background: var(--warn); }
.env-flag-key.bad { background: var(--bad); }

/* ===== 13c. QA Lab ===== */
.card-title h3 > svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 8px; color: var(--accent); }
.qa-note { display: flex; gap: 8px; align-items: flex-start; margin: -4px 0 14px; }
.qa-note svg { width: 16px; height: 16px; flex: none; color: var(--ok); margin-top: 1px; }
.qa-note code { font-family: var(--font-mono); font-size: 11.5px; }
.qa-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.qa-person { padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border); }
.qa-person header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }

  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
.qa-person dl { margin: 0; display: grid; gap: 2px; }
.qa-person dl > div { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.qa-person dl > div:last-child { border-bottom: 0; }
.qa-person dt { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.qa-person dd { margin: 0; min-width: 0; text-align: right; }
.qa-val { background: none; border: 0; padding: 0; font-size: 12.5px; text-align: right; word-break: break-all; cursor: copy; color: var(--text); }
.qa-val.mono, .t-v.mono, .t-chip.mono { font-family: var(--font-mono); font-size: 12px; }
.qa-val:hover, .qa-val:focus-visible { color: var(--accent); }
.qa-split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.qa-split > .card + .card { margin-top: 0; }
.qa-meta { margin-bottom: 4px; }
.qa-meta input, .qa-meta select, .qa-new input, .qa-new select, .qa-new textarea, #qaNotes { width: 100%; }
.qa-progress { margin: 12px 0 4px; }
.qa-progress > span.bad { background: linear-gradient(90deg, var(--bad), var(--warn)); }
.qa-group h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 0 6px; }
.qa-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; margin-bottom: 5px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--border); }
.qa-item.s-pass { border-left-color: var(--ok); }
.qa-item.s-fail { border-left-color: var(--bad); background: rgba(255, 69, 58, .07); }
.qa-item.s-skip { border-left-color: var(--muted); }
.qa-item.s-skip .qa-item-text { color: var(--muted); text-decoration: line-through; }
.qa-item-text { flex: 1; font-size: 13.5px; }
.qa-seg { display: inline-flex; flex: none; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.qa-seg button { width: 32px; height: 26px; border: 0; background: var(--surface); color: var(--muted); font-weight: 700; font-size: 13px; }
.qa-seg button + button { border-left: 1px solid var(--border); }
.qa-seg button:hover { color: var(--text); background: var(--surface-3); }
.qa-seg button.on.m-pass { background: var(--ok); color: #04130b; }
.qa-seg button.on.m-fail { background: var(--bad); color: #fff; }
.qa-seg button.on.m-skip { background: var(--muted); color: var(--bg); }
.qa-export { margin-top: 14px; display: grid; gap: 10px; }
.qa-export .tabs { margin: 0; }
.qa-msg { min-height: 190px; }
.qa-export .btn { justify-self: start; }
.qa-new { display: grid; gap: 10px; padding: 14px; margin-bottom: 14px; border: 1px dashed rgba(var(--accent-rgb), .5); border-radius: 14px; background: rgba(var(--accent-rgb), .05); }
.qa-new[hidden], .tool [hidden] { display: none !important; }
.qa-ticket-bar { justify-content: space-between; margin-bottom: 10px; }
.qa-ticket-bar .tabs { margin: 0; }
.qa-ticket-bar .search-box { max-width: 220px; }
.qa-tickets { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.qa-ticket { display: flex; gap: 10px; align-items: flex-start; padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); }
.qa-ticket.sev-blocker, .qa-ticket.sev-critical { border-left-color: var(--bad); }
.qa-ticket.sev-major { border-left-color: var(--warn); }
.qa-ticket.closed { opacity: .62; border-left-color: var(--ok); }
.qa-ticket.closed .qa-ttitle { text-decoration: line-through; }
.qa-ticket details { flex: 1; min-width: 0; }
.qa-ticket summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 8px; align-items: center; }
.qa-ticket summary::-webkit-details-marker { display: none; }
.qa-tid { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.qa-ttitle { font-weight: 600; font-size: 13.5px; }
.qa-tmeta { grid-column: 1 / -1; }
.qa-steps { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
.qa-tacts { display: flex; gap: 5px; flex: none; }
.qa-tacts .btn svg { margin: 0; }
@media (max-width: 1200px) { .qa-split { grid-template-columns: 1fr; } }

/* ===== 13d. Tools ===== */
/* masonry via CSS columns: cards of different heights pack without gaps */
.tool-grid { column-width: 360px; column-gap: 16px; }
.tool-grid > .card, .tool-grid > .card + .card { break-inside: avoid; margin: 0 0 16px; display: block; }
.tool-grid > .card[hidden] { display: none; }
.tool { scroll-margin-top: 16px; }
.tool.flash { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .35); }
.tool-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.tool-head h3 { font-size: 16px; }
.tool-head p { margin: 2px 0 0; }
.tool-ico { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: rgba(var(--accent-rgb), .14); color: var(--accent); }
.tool-ico svg { width: 20px; height: 20px; }
.tool-cat { margin-left: auto; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.tool-body { display: grid; gap: 10px; }
.tool-body > input, .tool-body > textarea, .tool-body > select { width: 100%; }
.tool .form-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tool .form-grid input, .tool .form-grid select { width: 100%; min-width: 0; }
.tool input, .tool select, .tool textarea { max-width: 100%; }
.t-row input[type=datetime-local] { flex: 1 1 180px; min-width: 0; }
.tool-body textarea.mono, .tool-body input.mono, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.t-row, .t-calc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.t-grow { flex: 1; min-width: 0; }
label.t-grow { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
label.t-grow input[type=range] { flex: 1; accent-color: var(--accent); padding: 0; }
.t-checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.t-checks label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.t-checks input { accent-color: var(--accent); width: 15px; height: 15px; }
.t-result { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); display: grid; gap: 2px; }
.t-big { font-family: var(--font-mono); font-size: 17px; font-weight: 600; word-break: break-all; color: var(--text); }
.t-meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.t-meter span { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .3s var(--ease), background .3s; background: var(--ok); }
.t-meter span.warn { background: var(--warn); } .t-meter span.bad { background: var(--bad); }
.t-actions { justify-content: flex-start; }
.t-list, .t-outs { display: grid; gap: 6px; }
.t-v { text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; word-break: break-all; cursor: copy; color: var(--text); transition: border-color .15s; }
.t-v:hover, .t-v:focus-visible { border-color: rgba(var(--accent-rgb), .6); }
.t-out { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: center; }
.t-k { font-size: 12px; color: var(--muted); }
.t-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.t-chip { padding: 4px 11px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; cursor: copy; }
.t-chip:hover, .t-chip.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .14); }
.t-chip[data-sla] { cursor: pointer; }
.t-num { width: 92px; }
.t-flags { width: 64px; }
.t-calc { font-size: 13.5px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.t-calc strong { margin-left: auto; font-family: var(--font-mono); color: var(--accent); }
.t-calc .t-num { padding: 6px 9px; }
.t-hl { white-space: pre-wrap; word-break: break-word; padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); max-height: 180px; overflow: auto; font-size: 12.5px; min-height: 40px; }
.t-ports { display: grid; gap: 2px; max-height: 236px; overflow: auto; }
.t-port { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; text-align: left; padding: 6px 8px; border: 0; border-radius: 8px; background: none; cursor: copy; font-size: 13px; }
.t-port:nth-child(odd) { background: var(--surface-2); }
.t-port:hover { background: rgba(var(--accent-rgb), .12); }
.t-port .mono { color: var(--accent); }
.t-tz { display: grid; gap: 3px; }
.t-tzrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 54px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
.t-tzrow:nth-child(odd) { background: var(--surface-2); }
.t-tzrow strong { font-size: 14px; }
.t-now { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.t-json pre { font-family: var(--font-mono); font-size: 12px; margin: 4px 0 0; padding: 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); max-height: 220px; overflow: auto; }
.t-file { cursor: pointer; }
@media (max-width: 520px) { .tool-grid { column-width: auto; columns: 1; } .t-out { grid-template-columns: 1fr; gap: 2px; } }

/* ===== 11. Links, Bookshelf, Terminal ===== */
.link-wall h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 10px; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.link-tile {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text); transition: border-color .15s, transform .15s;
}
.link-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.link-ico { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border); color: var(--muted); }
.link-ico svg { width: 18px; height: 18px; }
/* Brand marks & icon-in-text helpers */
svg.brand-mark { display: inline-block; flex: none; }
.plat svg.brand-mark { width: 12px; height: 12px; }
.plat:has(svg)::before { display: none; }
.th-brand { width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px; }
.term-mark { display: inline-grid; place-items: center; margin-left: 8px; }
.term-mark svg { width: 14px; height: 14px; }
.term-bar .term-mark + span { margin-left: 6px; }
.chip svg, .btn svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; }
.shift-ico { display: inline-grid; vertical-align: -3px; margin-right: 7px; color: var(--accent); }
.shift-ico svg { width: 18px; height: 18px; }
.empty-ok svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px; color: var(--ok); }
.mem-front svg { width: 46%; height: 46%; }
.link-name { font-weight: 500; font-size: 13px; }
.link-desc { font-size: 11px; color: var(--muted); }
.search-box { position: relative; max-width: 360px; width: 100%; }
.search-box input { width: 100%; padding-left: 34px; }
.search-box::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 16px; }
/* Bookcase: wood frame, planks repeat every row (slot 262px + plank 18px) */
.bookcase { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.shelf {
  --wood: #6b4423; --wood-hi: #a8743f; --wood-dk: #3b2412;
  padding: 18px 18px 0; border-radius: 14px; border: 10px solid var(--wood); border-bottom-width: 14px;
  background: linear-gradient(90deg, rgba(0,0,0,.35), transparent 8%, transparent 92%, rgba(0,0,0,.35)),
    repeating-linear-gradient(90deg, #2b1a0e 0 26px, #2f1d10 26px 27px, #281709 27px 61px), #2b1a0e;
  box-shadow: inset 0 10px 24px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.6);
}
.shelf-books {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px 3px; padding: 0 6px 18px; margin: 0 -18px; padding-inline: 24px;
  background: repeating-linear-gradient(to bottom, transparent 0 262px, var(--wood-hi) 262px 264px, var(--wood) 264px 274px, var(--wood-dk) 274px 280px);
}
.book { height: 262px; display: flex; align-items: flex-end; color: inherit; border: 0; background: none; padding: 0; transition: transform .25s var(--ease), opacity .2s, filter .2s; }
.book.tilt { transform: rotate(-5deg); transform-origin: bottom right; margin: 0 10px 0 8px; }
.spine {
  width: var(--w); height: var(--h); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 8px;
  border-radius: 4px 4px 2px 2px; color: #f3e7cc; position: relative;
  background:
    linear-gradient(90deg, rgba(0,0,0,.45) 0, rgba(255,255,255,.14) 14%, rgba(255,255,255,0) 38%, rgba(0,0,0,.12) 80%, rgba(0,0,0,.5) 100%),
    var(--spine);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 3px 0 4px -1px rgba(0,0,0,.45);
}
.spine-band { width: 100%; height: 5px; flex: none; border-block: 1px solid rgba(232,196,120,.75); opacity: .85; }
.spine-logo { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #f3e7cc; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.spine-logo svg { width: 15px; height: 15px; }
.spine-logo .brand-mark[style*="currentColor"] { color: #1f2937 !important; }
.spine-title {
  flex: 1; min-height: 0; writing-mode: vertical-rl; transform: rotate(180deg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .03em; text-shadow: 0 1px 1px rgba(0,0,0,.5);
}
.book.two .spine-title { white-space: normal; text-overflow: clip; line-height: 1.2; text-align: center; }
.spine-title mark { background: rgba(255,214,10,.45); color: #fff; }
.spine-cat { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.book:hover, .book:focus-visible, .book.active { transform: translateY(-12px); }
.book.tilt:hover, .book.tilt:focus-visible, .book.tilt.active { transform: rotate(-5deg) translateY(-12px); }
.book:focus-visible { outline: none; }
.book:focus-visible .spine, .book.active .spine { box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 0 0 0 2px var(--accent), 0 10px 22px -6px rgba(var(--accent-rgb),.7); }
.book.hit .spine { box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), 0 0 0 2px rgba(255,214,10,.8), 0 0 18px rgba(255,214,10,.45); }
.bookend { width: 16px; height: 120px; margin-left: 4px; align-self: flex-end; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #6b7280, #d1d5db 40%, #9ca3af); box-shadow: -3px 0 5px rgba(0,0,0,.4); }
.shelf-decor { display: flex; align-items: flex-end; gap: 22px; margin-left: 26px; }
.flat-stack { display: flex; flex-direction: column; align-items: center; }
.flat-stack i { display: block; width: var(--w); height: 17px; border-radius: 2px 4px 4px 2px; background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.3)), var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); border-left: 5px solid rgba(232,196,120,.6); }
.plant { width: 58px; height: 88px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
.book.dim { opacity: .22; filter: grayscale(.9); pointer-events: none; }
.shelf-empty { width: 100%; height: 262px; display: grid; place-items: center; color: #d6c3a0; border: 0; }
.book-desk { position: sticky; top: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin: 0; }
.desk-cover {
  width: 100%; aspect-ratio: 4 / 3; border-radius: 6px 12px 12px 6px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 16px;
  background: linear-gradient(90deg, rgba(0,0,0,.45) 0, rgba(0,0,0,0) 9%, rgba(255,255,255,.08) 10%, rgba(0,0,0,0) 30%), var(--spine);
  color: #f3e7cc; text-align: center; box-shadow: var(--shadow);
}
.desk-cover::after { content: ""; position: absolute; inset: 10px 10px 10px 26px; border: 1px solid rgba(232,196,120,.55); border-radius: 4px; pointer-events: none; }
.desk-logo { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #f3e7cc; }
.desk-logo svg { width: 30px; height: 30px; }
.desk-logo .brand-mark[style*="currentColor"] { color: #1f2937 !important; }
.desk-cover-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .03em; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.desk-title { margin: 0; }
.desk-desc { margin: 0; color: var(--muted); font-size: 13.5px; }
.desk-url { word-break: break-all; }
@media (max-width: 1100px) { .bookcase { grid-template-columns: 1fr; } .book-desk { position: static; } .desk-cover { aspect-ratio: 16 / 7; } }
.shelf-meta { font-size: 12.5px; color: var(--muted); margin: -4px 0 12px; }
.term {
  background: var(--term-bg); color: var(--term-text); border-radius: var(--radius); border: 1px solid #1d2a3f;
  font-family: var(--font-mono); overflow: hidden; box-shadow: var(--shadow);
}
.term-bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; background: #0c1322; border-bottom: 1px solid #1d2a3f; }
.term-bar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.term-bar i:nth-child(1) { background: #ff5f57; } .term-bar i:nth-child(2) { background: #febc2e; } .term-bar i:nth-child(3) { background: #28c840; }
.term-bar span { margin-left: 8px; color: #7f8ba3; font-size: 12px; }
.term-body { padding: 8px 6px 12px; }
.cmd { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 10px; border-radius: 7px; }
.cmd:hover { background: rgba(255,255,255,.04); }
.cmd-line { display: flex; gap: 8px; min-width: 0; }
.prompt { color: #22c55e; font-weight: 700; user-select: none; }
.cmd code { font-size: 13px; color: #e2fbe9; white-space: pre-wrap; word-break: break-all; }
.term mark { background: rgba(34,197,94,.32); color: #fff; }
.cmd-desc { grid-column: 1; font-size: 11.5px; color: #7f8ba3; font-family: var(--font); padding-left: 18px; }
.cmd-copy { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-family: var(--font-mono); font-size: 11px; color: #9fb0c9; background: #0c1322; border: 1px solid #23324d; border-radius: 6px; padding: 4px 10px; transition: color .15s, border-color .15s; }
.cmd-copy:hover, .cmd-copy.done { color: #22c55e; border-color: #22c55e; }
.term-bar .term-count { margin-left: auto; color: #7f8ba3; font-size: 11px; }
.term-cursor { display: flex; gap: 8px; padding: 6px 10px; }
.cursor { width: 8px; height: 15px; align-self: center; background: #22c55e; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
/* Terminal stays dark regardless of light mode: every colour above is literal, not a theme token */
body.light-mode .term { border-color: #1d2a3f; box-shadow: 0 10px 30px rgba(10,20,40,.25); }

/* ===== 12. Overlays: Palette, Lightbox, Scratchpad, Toasts ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(3,6,14,.62); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  display: none; z-index: 100; padding: 16px;
}
.overlay.open { display: flex; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.palette {
  margin: 10vh auto auto; width: min(620px, 100%); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; align-self: flex-start;
}
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 16px 18px; font-size: 16px; background: transparent; box-shadow: none; }
.palette-list { max-height: 52vh; overflow-y: auto; padding: 6px; margin: 0; list-style: none; }
.pal-item { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; }
.pal-item.sel { background: rgba(var(--accent-rgb),.14); }
.pal-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 74px; flex: none; }
.pal-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-sub { font-size: 12px; color: var(--muted); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-foot { display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }

.lightbox { align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
.lightbox img { max-width: min(92vw, 1000px); max-height: 76vh; border-radius: var(--radius); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.lb-cap { color: #e6ebf5; text-align: center; }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 26px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.4); color: #fff; }
.lb-prev { left: 18px; } .lb-next { right: 18px; }
.lb-close { position: fixed; top: 16px; right: 18px; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.4); color: #fff; }

.fab {
  position: fixed; right: 22px; bottom: 22px; width: 54px; height: 54px; border-radius: 50%; border: 0; z-index: 90;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font-size: 22px;
  box-shadow: 0 10px 30px rgba(var(--accent-rgb),.4); transition: transform .2s;
}
.fab:hover { transform: scale(1.06) rotate(-6deg); }
.scratch {
  position: fixed; right: 22px; bottom: 88px; width: min(360px, calc(100vw - 32px)); z-index: 90;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 24px 60px rgba(0,0,0,.45);
  display: none; flex-direction: column; overflow: hidden; transform-origin: bottom right;
  resize: both; min-width: 260px; min-height: 200px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px);
}
.scratch-head { cursor: grab; user-select: none; touch-action: none; }
.scratch.dragging { opacity: .93; transition: none; }
.scratch.dragging .scratch-head { cursor: grabbing; }
.scratch-grip { color: var(--muted); font-size: 12px; letter-spacing: 2px; margin-right: 6px; }
.scratch.open { display: flex; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
.scratch-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.scratch textarea { flex: 1 1 auto; height: 240px; min-height: 80px; resize: none; border: 0; border-radius: 0; background: var(--surface); font-family: var(--font-mono); font-size: 13px; box-shadow: none; }
.scratch-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }

.toasts { position: fixed; top: 18px; right: 18px; z-index: 200; display: grid; gap: 10px; width: min(340px, calc(100vw - 32px)); }
.toast {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  box-shadow: 0 14px 40px rgba(0,0,0,.4); animation: slideIn .35s cubic-bezier(.2,.9,.3,1.2) both;
}
.toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
.toast.out { animation: slideOut .3s ease forwards; }
.toast-msg { flex: 1; font-size: 13.5px; }
.toast-x { border: 0; background: none; color: var(--muted); padding: 0 2px; }
.toast-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
@keyframes slideIn { from { opacity: 0; transform: translateX(110%); } }
@keyframes slideOut { to { opacity: 0; transform: translateX(110%); } }

/* ===== 13. Reminders ===== */
.rem-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rem { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.rem.fired { opacity: .55; }
.rem-text { flex: 1; min-width: 0; }
.rem-when { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.rep-chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); margin-left: 6px; }
.side-timers { margin-top: 14px; display: grid; gap: 6px; }
.side-timers[hidden] { display: none; }
.side-timer { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); }
.side-timer:hover { border-color: var(--accent); }
.st-text { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-cd { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.st-bar { grid-column: 1 / -1; height: 3px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.st-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 1s linear; }
.side-timer.soon { border-color: var(--warn); animation: pulse 1s ease-in-out infinite; }
.side-timer.soon .st-cd { color: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(251,191,36,.22); } }

/* ===== 14. Games ===== */
.g2048 { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%; gap: 8px; padding: 8px; background: var(--surface-3); border-radius: var(--radius); aspect-ratio: 1; max-width: 360px; margin: 0 auto; touch-action: none; }
.g2048 div {
  border-radius: 9px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(16px, 4vw, 28px); background: var(--surface-2); transition: background .12s;
}
.g2048 div.pop { animation: tilePop .15s ease; }
@keyframes tilePop { 50% { transform: scale(1.1); } }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 360px; margin: 0 auto; }
.mem-card { display: block; width: 100%; aspect-ratio: 1; border: 0; background: none; padding: 0; perspective: 600px; }
.mem-inner { display: block; position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mem-card.flip .mem-inner, .mem-card.match .mem-inner { transform: rotateY(180deg); }
.mem-face { position: absolute; inset: 0; border-radius: 10px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: clamp(20px, 5vw, 30px); }
.mem-back { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font-family: var(--font-display); font-weight: 700; }
.mem-front { background: var(--surface-2); border: 1px solid var(--border); transform: rotateY(180deg); }
.mem-card.match .mem-front { border-color: var(--ok); box-shadow: inset 0 0 0 2px rgba(52,211,153,.4); }
.score-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.score { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 12px; text-align: center; min-width: 80px; }
.score b { display: block; font-family: var(--font-display); font-size: 18px; }
.score span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* ===== 15. Morale ===== */
.joke { font-size: 18px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.joke-punch { color: var(--accent); font-weight: 600; opacity: 0; transition: opacity .3s; }
.joke-punch.show { opacity: 1; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.g-item { border: 0; padding: 0; background: none; border-radius: var(--radius-sm); overflow: hidden; position: relative; aspect-ratio: 4/3; }
.g-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.g-item:hover img { transform: scale(1.06); }
.g-item span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 12px; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.7)); }

/* ===== 15b. Support Desk ===== */
.status.info { color: var(--accent); background: rgba(var(--accent-rgb), .14); }
.sd-kpi { cursor: default; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
.sd-kpi svg { width: 104px; height: 36px; overflow: visible; }
.sd-delta { font-weight: 600; }
.sd-delta.good { color: var(--ok); }
.sd-delta.bad { color: var(--bad); }
.sd-split { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sd-split > .card + .card { margin-top: 0; }
.sd-queue, .sd-ticket { display: flex; flex-direction: column; height: min(78vh, 820px); min-height: 520px; }
.sd-queue { padding: 14px; }
.sd-queue .tabs { margin-bottom: 10px; }
.sd-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; }
.sd-tools input { grid-column: 1 / -1; }
.sd-queue .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; }
.sd-queue .tab { padding: 6px 10px; font-size: 12.5px; flex: none; }
.sd-queue .tab .badge { min-width: 18px; padding: 0 6px; }
.sd-tools input, .sd-tools select { min-width: 0; padding: 7px 11px; font-size: 13px; }
.sd-tools select { border-radius: var(--radius-pill); }
.sd-list { list-style: none; margin: 0; padding: 2px; overflow-y: auto; flex: 1; display: grid; align-content: start; gap: 6px; }
.sd-row {
  width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 10px 10px 16px;
  border-radius: 14px; border: 1px solid transparent; background: none; position: relative;

// --- 2. Core Helpers (esc, storage, DOM, clipboard) ---
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ESC_MAP[ch]); }
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(SITE.storagePrefix + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(SITE.storagePrefix + key, JSON.stringify(value)); } catch { /* storage full or blocked */ }
  }
};

function safeUrl(u) { const v = String(u ?? '').trim(); return /^(https?:|mailto:|tel:)/i.test(v) ? v : '#'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

async function copyText(text, label = 'Copied to clipboard') {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { /* ignore */ }
    ta.remove();
  }
  toast(label, 'ok');
}

function brand(key, cls = '') {

}

function platChip(p) {

}

// --- 3. Toast Notifications ---
function toast(message, type = 'info', ms = 3200, actions = []) {
  const box = $('#toasts');
  while (box.children.length >= 5) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="toast-msg">${esc(message)}${actions.length
    ? `<div class="toast-actions">${actions.map((a, i) => `<button class="btn sm" type="button" data-ta="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>
    <button class="toast-x" type="button" aria-label="Dismiss">✕</button>`;
  let closed = false;
  const close = () => { if (closed) return; closed = true; el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  el.addEventListener('click', e => {
    if (e.target.closest('.toast-x')) { close(); return; }
    const b = e.target.closest('[data-ta]');
    if (b) { actions[+b.dataset.ta].run(); close(); }
  });
  box.appendChild(el);
  if (ms > 0) setTimeout(close, ms);
  return close;
}

// --- 4. Theme Engine ---
function applyTheme(id) {
  if (!SITE.themes[id]) id = SITE.defaultTheme;
  Object.keys(SITE.themes).forEach(t => document.body.classList.remove(`theme-${t}`));
  document.body.classList.add(`theme-${id}`);
  store.set('theme', id);
}
function applyLight(on) {
  document.body.classList.toggle('light-mode', on);
  $('#lightToggle').textContent = on ? '☾' : '☀';
  store.set('light', on);
}
function initTheme() {
  const sel = $('#themeSelect');
  sel.innerHTML = Object.entries(SITE.themes).map(([id, label]) => `<option value="${esc(id)}">${esc(label)}</option>`).join('');
  const saved = store.get('theme', SITE.defaultTheme);
  sel.value = SITE.themes[saved] ? saved : SITE.defaultTheme;
  applyTheme(sel.value);
  applyLight(store.get('light', false));
  sel.addEventListener('change', () => { applyTheme(sel.value); toast(`Theme: ${SITE.themes[sel.value]}`); });
  $('#lightToggle').addEventListener('click', () => applyLight(!document.body.classList.contains('light-mode')));
}

const ALL_SECTIONS = SITE.nav.flatMap(g => g.items);
function renderNav() {
  $('#nav').innerHTML = SITE.nav.map(g => `
    <div class="nav-group-label">${esc(g.group)}</div>
    ${g.items.map(it => `
      <button class="nav-btn" type="button" data-section="${esc(it.id)}">
        <span class="nav-ico">${icon(it.icon)}</span>
        <span class="nav-label">${esc(it.label)}</span>
        ${it.badge ? `<span class="badge" data-badge="${esc(it.badge)}">0</span>` : ''}
      </button>`).join('')}
  `).join('');
  $('#nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-section]');
    if (btn) showSection(btn.dataset.section);
  });
}
function showSection(id) {
  if (!ALL_SECTIONS.some(s => s.id === id)) id = 'dashboard';
  $$('.page-section').forEach(s => s.classList.toggle('active', s.id === `sec-${id}`));
  $$('.nav-btn').forEach(b => {
    const on = b.dataset.section === id;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  store.set('section', id);
  if (location.hash !== `#${id}`) history.replaceState(null, '', `#${id}`);
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function currentSection() { return store.get('section', 'dashboard'); }
function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); }

function updateBadges() {
  const mt = matrixTotals();
  const counts = {
    progress: `${mt.pct}%`,
    tasks: shiftRemaining(currentShift().id),
    templates: SITE.templates.length,
    envs: envCount(),
    links: SITE.linkGroups.reduce((n, g) => n + g.items.length, 0),
    docs: SITE.docs.length,
    commands: SITE.commands.reduce((n, g) => n + g.items.length, 0),
    reminders: state.reminders.filter(r => !r.fired).length,
    support: sdActiveCount(),
    qa: qaOpenCount(),
    tools: SITE.tools.length
  };
  $$('[data-badge]').forEach(b => {
    const key = b.dataset.badge;
    b.textContent = counts[key] ?? 0;
    if (key === 'progress') {
      b.title = `${mt.done}/${mt.total} checks completed · ${mt.failed} failed`;
      b.classList.toggle('hot', mt.failed > 0);
      b.classList.toggle('ok', !mt.failed && mt.pct === 100);
      b.classList.toggle('accent', !mt.failed && mt.pct > 0 && mt.pct < 100);
    } else {
      const hot = key === 'support' && sdBreachedCount() > 0;
      b.classList.toggle('hot', hot);
      b.classList.toggle('accent', !hot && (key === 'tasks' || key === 'reminders' || key === 'support') && counts[key] > 0);
      if (key === 'support') b.title = hot ? `${sdBreachedCount()} ticket(s) past SLA` : `${counts[key]} active tickets`;
    }
  });
  renderStats();
}

// --- 7. Shift Logic & Hero Banner ---
function inShift(s, h) { return s.start < s.end ? h >= s.start && h < s.end : h >= s.start || h < s.end; }
function currentShift(date = new Date()) {
  return SITE.shifts.find(s => inShift(s, date.getHours())) || SITE.shifts[0];
}
function nextShift(s) { return SITE.shifts[(SITE.shifts.indexOf(s) + 1) % SITE.shifts.length]; }
function greeting(h) {
  if (h < 5) return 'Burning the midnight oil';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 23) return 'Good evening';
  return 'Good night shift';
}

function updateHero() {
  const now = new Date();
  const s = currentShift(now);
  const n = nextShift(s);
  const g = $('#heroGreet');
  if (!g) return;
  g.textContent = `${greeting(now.getHours())}, team — you're on the ${s.name} shift.`;
  $('#heroShift').innerHTML = `${icon(s.icon)}${esc(`${s.name} · ${pad(s.start)}:00–${pad(s.end)}:00`)}`;
  $('#heroDate').innerHTML = `${icon('calendar')}${esc(now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }))}`;
  const nextAt = new Date(now); nextAt.setHours(n.start, 0, 0, 0);
  if (nextAt <= now) nextAt.setDate(nextAt.getDate() + 1);
  const mins = Math.round((nextAt - now) / 60000);
  $('#heroNext').innerHTML = `${icon('next')}${esc(`${n.name} in ${Math.floor(mins / 60)}h ${mins % 60}m`)}`;
}
function renderStats() {
  const el = $('#stats');
  if (!el) return;
  const statuses = customerStatuses();
  const healthy = statuses.filter(s => s.level === 'ok').length;
  const bad = statuses.filter(s => s.level === 'bad').length;
  const s = currentShift();
  const total = s.tasks.length, done = total - shiftRemaining(s.id);
  const pending = state.reminders.filter(r => !r.fired).length;
  const cells = SITE.customers.length * SITE.checklistColumns.length;
  const mt = matrixTotals(), checked = mt.done + mt.failed;
  const card = (label, value, sub, pct, goto) => `
    <div class="stat" data-goto="${esc(goto)}" role="button" tabindex="0">
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-value">${esc(value)}</div>
      <div class="stat-sub">${esc(sub)}</div>
      ${pct !== null ? `<div class="progress"><span style="width:${Math.round(pct)}%"></span></div>` : ''}
    </div>`;
  el.innerHTML =
    card('Healthy customers', `${healthy}/${statuses.length}`, `${bad} need attention`, statuses.length ? healthy / statuses.length * 100 : 0, 'customers') +
    card(`${s.name} tasks`, `${done}/${total}`, `${total - done} remaining`, total ? done / total * 100 : 0, 'shifts') +
    card('Matrix coverage', `${cells ? Math.round(checked / cells * 100) : 0}%`, `${checked} of ${cells} checks done`, cells ? checked / cells * 100 : 0, 'customers') +
    card('Reminders', pending, pending ? 'pending' : 'all clear', null, 'reminders');

  const att = $('#dashAttention');
  const issues = statuses.filter(x => x.level === 'bad');
  att.innerHTML = issues.length
    ? `<ul class="check-list">${issues.map(x => `<li class="check-item" data-goto="customers"><span class="status bad">Issue</span><span class="ci-text"><strong>${esc(x.customer.name)}</strong> <span class="muted small">— ${esc(x.issues.join(', '))}</span></span></li>`).join('')}</ul>`
    : `<div class="empty empty-ok">${icon('checkCircle')}No open issues in the matrix.</div>`;

  const rem = $('#dashReminders');
  const up = state.reminders.filter(r => !r.fired).sort((a, b) => a.at - b.at).slice(0, 4);
  rem.innerHTML = up.length
    ? `<ul class="rem-list">${up.map(r => `<li class="rem"><span class="rem-when">${esc(fmtTime(r.at))}</span><span class="rem-text">${esc(r.text)}</span><span class="small muted">${esc(fmtCountdown(r.at))}</span></li>`).join('')}</ul>`
    : `<div class="empty">No reminders scheduled.</div>`;
}

// --- 8. World Clocks & Customer World Map ---
const clockFormatters = SITE.timezones.map(c => ({
  time: new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, ...(c.tz ? { timeZone: c.tz } : {}) }),
  short: new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit', hour12: false, ...(c.tz ? { timeZone: c.tz } : {}) }),
  day: new Intl.DateTimeFormat([], { weekday: 'short', day: 'numeric', month: 'short', ...(c.tz ? { timeZone: c.tz } : {}) }),
  hour: new Intl.DateTimeFormat('en-US', { hour: 'numeric', hourCycle: 'h23', ...(c.tz ? { timeZone: c.tz } : {}) })
}));
function zoneCustomers(zoneId) { return SITE.customers.filter(c => c.zone === zoneId); }
function renderClocks() {
  $('#clocks').innerHTML = SITE.timezones.map((c, i) => {
    const names = zoneCustomers(c.id).map(x => x.name).join(', ');
    return `
    <div class="clock ${c.primary ? 'local' : ''}">
      <div class="clock-label"><span>${esc(c.label)}</span><span class="dot" data-clock-dot="${i}" title="Business hours"></span></div>
      <div class="clock-time" data-clock-time="${i}">--:--:--</div>
      <div class="clock-day"><span data-clock-day="${i}"></span>${names ? ` · <span class="clock-cust">${esc(names)}</span>` : ''}</div>
    </div>`;
  }).join('');
  tickClocks();
}
function zoneOpen(i, now) {
  const h = parseInt(clockFormatters[i].hour.format(now), 10) % 24;
  return h >= SITE.businessHours.start && h < SITE.businessHours.end;
}
function tickClocks() {
  const now = new Date();
  clockFormatters.forEach((f, i) => {
    const t = $(`[data-clock-time="${i}"]`); if (!t) return;
    t.textContent = f.time.format(now);
    $(`[data-clock-day="${i}"]`).textContent = f.day.format(now);
    const open = zoneOpen(i, now);
    const dot = $(`[data-clock-dot="${i}"]`);
    dot.className = `dot ${open ? 'on' : 'off'}`;
    dot.title = open ? 'Business hours' : 'After hours';
    const mt = $(`[data-map-time="${i}"]`);
    if (mt) mt.textContent = f.short.format(now);
  });
}

// Equirectangular projection cropped to lat 84°N … 58°S (1000 × 394 viewBox)
const MAP = { w: 1000, top: 84, bottom: -58 };
MAP.h = Math.round((MAP.top - MAP.bottom) / 360 * MAP.w);
function mapX(lon) { return (lon + 180) / 360 * MAP.w; }
function mapY(lat) { return (MAP.top - lat) / 360 * MAP.w; }

// Minimal TopoJSON → SVG path decoder (quantized, delta-encoded arcs) — no d3/topojson dependency
function topoToPath(topo, objectName) {
  const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(([dx, dy]) => { x += dx; y += dy; return [x * sx + tx, y * sy + ty]; });
  });
  const ring = ids => {
    const pts = [];
    ids.forEach(id => {
      const a = id < 0 ? arcs[~id].slice().reverse() : arcs[id];
      a.forEach((p, k) => { if (k || !pts.length) pts.push(p); });
    });
    // Unwrap longitudes so rings crossing the antimeridian stay continuous, then draw a ±360° copy for the wrapped part
    let shift = 0, min = Infinity, max = -Infinity;
    const out = [];
    pts.forEach(([lon, lat], k) => {
      if (k) {
        const d = lon - pts[k - 1][0];
        if (d > 180) shift -= 360; else if (d < -180) shift += 360;
      }
      const L = lon + shift; min = Math.min(min, L); max = Math.max(max, L);
      out.push([L, lat]);
    });
    const draw = off => 'M' + out.map(([lon, lat]) => `${mapX(lon + off).toFixed(1)},${mapY(lat).toFixed(1)}`).join('L') + 'Z';
    return draw(0) + (max > 180 ? draw(-360) : '') + (min < -180 ? draw(360) : '');
  };
  const geoms = topo.objects[objectName].geometries || [topo.objects[objectName]];
  return geoms.map(g =>
    g.type === 'Polygon' ? g.arcs.map(ring).join('') :
    g.type === 'MultiPolygon' ? g.arcs.map(poly => poly.map(ring).join('')).join('') : ''
  ).join('');
}

// Night-side polygon from the sub-solar point (approximate, ignores equation of time)
function nightPath(date = new Date()) {
  const rad = Math.PI / 180;
  const doy = Math.floor((date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000);
  let decl = -23.44 * Math.cos(2 * Math.PI / 365 * (doy + 10));
  if (Math.abs(decl) < 0.1) decl = decl < 0 ? -0.1 : 0.1;
  const utcH = date.getUTCHours() + date.getUTCMinutes() / 60;
  const sunLon = -(utcH - 12) * 15;
  const pts = [];
  for (let lon = -180; lon <= 180; lon += 4) {
    const lat = Math.atan(-Math.cos((lon - sunLon) * rad) / Math.tan(decl * rad)) / rad;
    pts.push(`${mapX(lon).toFixed(1)},${mapY(lat).toFixed(1)}`);
  }
  const edge = decl > 0 ? MAP.h + 40 : -40; // night wraps the pole in winter darkness
  return `M0,${edge}L${pts.join('L')}L${MAP.w},${edge}Z`;
}

function renderWorldMap() {
  const host = $('#worldMap');
  if (!host) return;
  const grid = [];
  for (let lon = -150; lon <= 150; lon += 30) grid.push(`M${mapX(lon)},0V${MAP.h}`);
  for (let lat = -30; lat <= 60; lat += 30) grid.push(`M0,${mapY(lat)}H${MAP.w}`);
  const health = Object.fromEntries(customerStatuses().map(s => [s.customer.id, s.level]));
  host.innerHTML = `
    <svg class="map-svg" viewBox="0 0 ${MAP.w} ${MAP.h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path class="map-grid" d="${grid.join('')}"/>
      <path class="map-land" id="mapLand" d=""/>
      <path class="map-night" id="mapNight" d="${nightPath()}"/>
    </svg>
    ${SITE.timezones.map((z, i) => {
      const custs = zoneCustomers(z.id);
      if (!custs.length) return '';
      const level = custs.some(c => health[c.id] === 'bad') ? 'bad' : custs.every(c => health[c.id] === 'ok') ? 'ok' : 'warn';

}
let landPathCache = null;
function loadLand() {
  const el = $('#mapLand');
  if (!el) return;
  if (landPathCache) { el.setAttribute('d', landPathCache); return; }
  fetch(SITE.worldMapUrl)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(topo => {
      landPathCache = topoToPath(topo, 'land');
      const cur = $('#mapLand');
      if (cur) cur.setAttribute('d', landPathCache);
    })
    .catch(() => { const n = $('#mapNote'); if (n) n.textContent = 'Coastlines unavailable offline — pins and clocks still live.'; });
}

}

const MX = [

  { sym: '✓', label: 'Completed', cls: 's1' },

function sdUpdate(id, fn) {
  state.support.tickets = state.support.tickets.map(t => (t.id === id ? fn(t) : t));
  sdSave();
}
function sdSetDraft(id, draft) {
  if (draft.text) state.support.drafts[id] = draft; else delete state.support.drafts[id];
  sdSave();
}
function sdSelect(id) {
  if (!sdTicket(id)) return;
  state.support.selected = id;
  sdUpdate(id, t => (t.unread ? { ...t, unread: false } : t));
  $('#sdTicket').classList.remove('show-cust');
  sdPaintQueue();
  sdPaintTicket();
  if (window.matchMedia('(max-width: 1100px)').matches) $('#sdTicket').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function sdMove(step) {
  const list = sdVisible();
  if (!list.length) return;
  const i = list.findIndex(t => t.id === state.support.selected);
  const next = list[i === -1 ? 0 : Math.min(list.length - 1, Math.max(0, i + step))];
  sdSelect(next.id);
  const row = $(`#sdList [data-tid="${CSS.escape(next.id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
}
function sdSystem(t, body) { return { id: `${t.id}-${uid()}`, kind: 'system', author: 'System', body, at: Date.now() }; }
function sdSetStatus(status) {
  const t = sdTicket(state.support.selected);
  if (!t || !SD_STATUS[status] || t.status === status) return;
  sdUpdate(t.id, x => ({ ...x, status, thread: [...x.thread, sdSystem(x, `${SITE.support.agent} changed status to ${SD_STATUS[status].label}`)] }));
  sdPaintAll();
  updateBadges();
  toast(`${t.id} → ${SD_STATUS[status].label}`, status === 'resolved' ? 'ok' : 'info');
}
function sdSend() {
  const t = sdTicket(state.support.selected);
  if (!t) return;
  const d = state.support.drafts[t.id] || { text: $('#sdText').value, mode: 'reply' };
  const body = $('#sdText').value.trim();
  if (!body) return;
  const note = d.mode === 'note';
  const entry = { id: `${t.id}-${uid()}`, kind: note ? 'note' : 'agent', author: SITE.support.agent, body, at: Date.now() };
  sdUpdate(t.id, x => {
    if (note) return { ...x, thread: [...x.thread, entry] };
    // Replying claims an unassigned ticket and moves a new one to In progress.
    const progress = x.status === 'open';
    return {
      ...x,
      assignee: x.assignee || SITE.support.agent,
      status: progress ? 'in_progress' : x.status,
      thread: [...x.thread, entry, ...(progress ? [sdSystem(x, `Status changed to ${SD_STATUS.in_progress.label}`)] : [])]
    };
  });
  sdSetDraft(t.id, { text: '', mode: d.mode });
  sdPaintAll();
  updateBadges();
  toast(note ? 'Internal note added' : `Reply sent to ${sdCustomer(t.customer).persona}`, 'ok');
}
function sdReset() {
  state.support = seedSupport();
  sdSave();
  $('#sdSearch').value = '';
  $('#sdFilter').value = 'active';
  sdPaintAll();
  updateBadges();
  toast('Support demo data reset', 'info');
}
/** Minute tick: refresh relative times/SLA countdowns and raise a toast once per SLA breach. */
function tickSupport() {
  if (!state.support) return;
  let changed = false;
  state.support.tickets.forEach(t => {
    const sla = sdSla(t);
    if (sla && sla.breached && !t.slaWarned) {
      t.slaWarned = true;
      changed = true;
      toast(`SLA breached on ${t.id} — ${t.subject}`, 'warn', 8000, [{ label: 'Open', run: () => { showSection('support'); sdSelect(t.id); } }]);
    }
  });
  if (changed) { sdSave(); updateBadges(); }
  sdPaintKpis();
  sdPaintQueue();
  const t = sdTicket(state.support.selected);
  if (t) { sdPaintHead(t); sdPaintThread(t, true); }
}

// --- 19. Command Palette (Ctrl+K) ---
let palItems = [], palSel = 0, palIndex = null;
function paletteIndex() {
  const items = [];
  ALL_SECTIONS.forEach(s => items.push({ type: 'Section', label: s.label, sub: 'go to', run: () => showSection(s.id) }));
  SITE.shortcuts.forEach(sc => items.push({ type: 'Shortcut', label: sc.label, sub: sc.keys, kbd: true, run: () => ACTIONS[sc.action] && ACTIONS[sc.action]() }));
  SITE.customers.forEach(c => items.push({ type: 'Customer', label: c.name, sub: `${c.domain} · ${c.platforms.join(' / ')} · TAM ${c.manager}`, run: () => showSection('customers') }));
  (state.support ? state.support.tickets : []).forEach(t => items.push({ type: 'Ticket', label: t.subject, sub: `${t.id} · ${sdCustomer(t.customer).name} · ${SD_STATUS[t.status].label}`, run: () => { showSection('support'); sdSelect(t.id); } }));
  SITE.templates.forEach(t => items.push({ type: 'Template', label: t.title, sub: 'copy', run: () => copyTemplate(t.id) }));
  SITE.linkGroups.forEach(g => g.items.forEach(l => items.push({ type: 'Link', label: l.name, sub: `${g.group} · ${l.desc}`, run: () => window.open(safeUrl(l.url), '_blank', 'noopener') })));
  SITE.docs.forEach(d => items.push({ type: 'Doc', label: d.title, sub: d.cat, run: () => window.open(safeUrl(d.url), '_blank', 'noopener') }));
  SITE.commands.forEach(g => g.items.forEach(c => items.push({ type: 'Command', label: c.cmd, sub: g.group, mono: true, run: () => copyText(c.cmd, 'Command copied') })));
  Object.entries(SITE.themes).forEach(([id, label]) => items.push({ type: 'Theme', label: `Theme: ${label}`, sub: '', run: () => { $('#themeSelect').value = id; applyTheme(id); } }));
  items.push({ type: 'Action', label: 'Generate shift handoff', sub: '', run: () => { showSection('shifts'); $('#hoGen').click(); } });
  items.push({ type: 'Action', label: 'Generate checklist report', sub: '', run: () => { showSection('customers'); $('#mxReport').click(); } });
  items.push({ type: 'Action', label: 'Export versions to Excel', sub: '', run: exportExcel });
  items.push({ type: 'Action', label: 'Reset Support Desk demo data', sub: '', run: () => { showSection('support'); sdReset(); } });
  return items;
}
function openPalette() {
  palIndex = paletteIndex(); // rebuilt per open so it reflects current config/state
  $('#paletteOverlay').classList.add('open');
  const inp = $('#paletteInput');
  inp.value = '';
  palSel = 0;
  filterPalette();
  inp.focus(); // synchronous so keystrokes typed right after Ctrl+K are not lost
}
function closePalette() { $('#paletteOverlay').classList.remove('open'); }
function isPaletteOpen() { return $('#paletteOverlay').classList.contains('open'); }
function filterPalette() {
  const words = $('#paletteInput').value.toLowerCase().split(/\s+/).filter(Boolean);
  const all = palIndex || paletteIndex();
  palItems = (words.length
    ? all.filter(it => { const hay = `${it.type} ${it.label} ${it.sub}`.toLowerCase(); return words.every(w => hay.includes(w)); })
    : all).slice(0, 50);
  palSel = Math.min(palSel, Math.max(palItems.length - 1, 0));
  $('#paletteList').innerHTML = palItems.length ? palItems.map((it, i) => `
    <li class="pal-item ${i === palSel ? 'sel' : ''}" data-pi="${i}" id="pal-${i}" role="option" aria-selected="${i === palSel}">
      <span class="pal-type">${esc(it.type)}</span>
      <span class="pal-label" ${it.mono ? 'style="font-family:var(--font-mono);font-size:13px"' : ''}>${esc(it.label)}</span>
      <span class="pal-sub">${it.kbd ? `<kbd>${esc(it.sub)}</kbd>` : esc(it.sub)}</span>
    </li>`).join('') : `<li class="empty" style="margin:8px">No results</li>`;
  $('#paletteInput').setAttribute('aria-activedescendant', palItems.length ? `pal-${palSel}` : '');
  const sel = $('.pal-item.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function runPalette(i) {
  const it = palItems[i];
  if (!it) return;
  closePalette();
  it.run();
}
function initPalette() {
  const inp = $('#paletteInput');
  inp.setAttribute('role', 'combobox');
  inp.setAttribute('aria-controls', 'paletteList');
  inp.setAttribute('aria-expanded', 'true');
  inp.addEventListener('input', () => { palSel = 0; filterPalette(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % Math.max(palItems.length, 1); filterPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + palItems.length) % Math.max(palItems.length, 1); filterPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(palSel); }
  });
  $('#paletteList').addEventListener('click', e => { const li = e.target.closest('[data-pi]'); if (li) runPalette(+li.dataset.pi); });
  $('#paletteList').addEventListener('mousemove', e => {
    const li = e.target.closest('[data-pi]');
    if (!li || +li.dataset.pi === palSel) return;
    $$('.pal-item.sel').forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-selected', 'false'); });
    palSel = +li.dataset.pi;
    li.classList.add('sel'); li.setAttribute('aria-selected', 'true');
  });
  $('#paletteOverlay').addEventListener('click', e => { if (e.target.id === 'paletteOverlay') closePalette(); });
  $('#paletteHint').addEventListener('click', openPalette);
  $('#topSearch').addEventListener('click', openPalette);
}

// --- 20. Floating Scratchpad (draggable, resizable, autosaved) ---
let scratchTimer = null, scratchGeomTimer = null;
function scratchEl() { return $('#scratch'); }
function clampGeom(g) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(Math.max(g.w, 260), vw - 16);
  const h = Math.min(Math.max(g.h, 200), vh - 16);
  return { w, h, x: Math.min(Math.max(g.x, 8), vw - w - 8), y: Math.min(Math.max(g.y, 8), vh - h - 8) };
}
function applyGeom(g) {
  const el = scratchEl();
  Object.assign(el.style, { left: `${g.x}px`, top: `${g.y}px`, width: `${g.w}px`, height: `${g.h}px`, right: 'auto', bottom: 'auto' });
}
function currentGeom() {
  // offset* = untransformed layout box (getBoundingClientRect would include the open animation's scale)
  const el = scratchEl();
  return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
}
function resetScratchGeom() {
  const el = scratchEl();
  ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(k => { el.style[k] = ''; });
  store.set('scratchGeom', null);
  applyGeom(clampGeom(currentGeom())); // re-anchor to top/left so CSS resize grows toward the handle
}
function toggleScratch(force) {
  const el = scratchEl();
  const open = typeof force === 'boolean' ? force : !el.classList.contains('open');
  el.classList.toggle('open', open);
  store.set('scratchOpen', open);
  if (!open) return;
  const saved = store.get('scratchGeom', null);
  if (saved) applyGeom(clampGeom(saved)); else applyGeom(clampGeom(currentGeom()));
  setTimeout(() => $('#scratchText').focus(), 20);
}
function initScratch() {
  const el = scratchEl(), ta = $('#scratchText'), head = $('.scratch-head', el);
  ta.value = state.scratch;
  ta.addEventListener('input', () => {
    $('#scratchStatus').textContent = 'Saving…';
    clearTimeout(scratchTimer);
    scratchTimer = setTimeout(() => {
      state.scratch = ta.value;
      store.set('scratch', ta.value);
      $('#scratchStatus').textContent = `Saved ${fmtTime(Date.now())} · ${ta.value.length} chars`;
    }, 400);
  });

  let drag = null;
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    const g = currentGeom();
    drag = { dx: e.clientX - g.x, dy: e.clientY - g.y, w: g.w, h: g.h };
    head.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  head.addEventListener('pointermove', e => {
    if (!drag) return;
    applyGeom(clampGeom({ x: e.clientX - drag.dx, y: e.clientY - drag.dy, w: drag.w, h: drag.h }));
  });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    el.classList.remove('dragging');
    store.set('scratchGeom', currentGeom());
  };
  head.addEventListener('pointerup', endDrag);
  head.addEventListener('pointercancel', endDrag);
  head.addEventListener('dblclick', e => { if (!e.target.closest('button')) resetScratchGeom(); });

  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      if (!el.classList.contains('open') || drag) return;
      clearTimeout(scratchGeomTimer);
      scratchGeomTimer = setTimeout(() => { if (el.style.left) store.set('scratchGeom', currentGeom()); }, 250);
    }).observe(el);
  }
  window.addEventListener('resize', () => { if (el.classList.contains('open')) applyGeom(clampGeom(currentGeom())); });

  $('#scratchFab').addEventListener('click', () => toggleScratch());
  $('#scratchClose').addEventListener('click', () => toggleScratch(false));
  $('#scratchCopy').addEventListener('click', () => copyText(ta.value, 'Scratchpad copied'));
  $('#scratchClear').addEventListener('click', () => {
    if (!ta.value) return;
    const backup = ta.value;
    ta.value = ''; state.scratch = ''; store.set('scratch', '');
    toast('Scratchpad cleared', 'warn', 6000, [{ label: 'Undo', run: () => { ta.value = backup; state.scratch = backup; store.set('scratch', backup); } }]);
  });
  if (store.get('scratchOpen', false)) toggleScratch(true);
}

// --- 21. Keyboard Shortcuts (driven by SITE.shortcuts) ---
const ACTIONS = {
  palette: () => (isPaletteOpen() ? closePalette() : openPalette()),
  scratch: () => toggleScratch(),
  light: () => applyLight(!document.body.classList.contains('light-mode')),
  reminder: () => { showSection('reminders'); setTimeout(() => { const t = $('#remText'); if (t) t.focus(); }, 60); },
  beep: () => { tripleBeep(); toast('🔔 Test beep'); },
  search: () => {
    const inp = $('.page-section.active [data-page-search]');
    if (inp) inp.focus(); else openPalette();
  },
  close: () => {
    if (isPaletteOpen()) return closePalette();
    if ($('#lightbox').classList.contains('open')) return closeLightbox();
    if (scratchEl().classList.contains('open')) return toggleScratch(false);
    closeSidebar();
  }
};
function isTyping(e) { const t = e.target; return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
function matchShortcut(e, combo) {
  const parts = combo.split('+');
  const key = parts.pop();
  if ((e.ctrlKey || e.metaKey) !== parts.includes('Ctrl') || e.altKey !== parts.includes('Alt')) return false;
  if (parts.includes('Shift') && !e.shiftKey) return false;
  if (key === 'Esc') return e.key === 'Escape';
  if (/^[A-Z]$/.test(key)) return e.code === `Key${key}`;
  if (/^\d$/.test(key)) return e.code === `Digit${key}`;
  return e.key === key;
}
function initKeys() {
  document.addEventListener('keydown', e => {
    const typing = isTyping(e);
    for (const sc of SITE.shortcuts) {
      if ((sc.global || !typing) && matchShortcut(e, sc.keys)) {
        e.preventDefault();
        if (ACTIONS[sc.action]) ACTIONS[sc.action]();
        return;
      }
    }
    if ($('#lightbox').classList.contains('open')) {
      if (e.key === 'ArrowLeft') openLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight') openLightbox(lbIndex + 1);
      return;
    }
    if (typing || isPaletteOpen()) return;
    if ($('#sec-games').classList.contains('active')) {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
      const dir = map[e.key];
      if (dir) { e.preventDefault(); move2048(dir); }
    }
    if ($('#sec-support').classList.contains('active') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === 'j' || e.key === 'k') { e.preventDefault(); sdMove(e.key === 'j' ? 1 : -1); }
      else if (e.key === 'r') { e.preventDefault(); const ta = $('#sdText'); if (ta && !$('#sdComposer').hidden) ta.focus(); }
    }
  });
}

// --- 22. Boot ---
function boot() {
  $('#brandName').textContent = SITE.name;
  $('#brandSub').textContent = SITE.tagline;
  $('#topTitle').textContent = SITE.name;
  $('#footNote').textContent = `Data stored locally · ${SITE.storagePrefix}*`;
  document.title = `${SITE.name} — ${SITE.tagline}`;

  renderNav();
  renderClocks();
  renderDashboard();
  renderCustomers();
  renderSupport();
  renderShifts();
  renderTemplates();
  renderVersions();
  renderLinks();
  renderDocs();
  renderTerminal();
  renderReminders();
  renderGames();
  renderMorale();
  initTheme();
  initPalette();
  initScratch();
  initKeys();

  $('#menuBtn').addEventListener('click', openSidebar);
  $('#scrim').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => {
    const st = e.target.closest && e.target.closest('.stat[data-goto]');
    if (st && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showSection(st.dataset.goto); }
  });
  window.addEventListener('hashchange', () => showSection(location.hash.slice(1)));
  window.addEventListener('storage', e => {
    if (e.key && e.key.startsWith(SITE.storagePrefix)) toast('Data changed in another tab — reload to sync', 'warn');
  });

  showSection(location.hash.slice(1) || currentSection());
  updateBadges();

  let lastShift = currentShift().id;
  setInterval(() => {
    tickClocks();
    checkReminders();
    const now = new Date();
    if (now.getSeconds() === 0) {
      updateHero(); renderStats(); tickSupport(); tickWorldMap();
      const s = currentShift(now);
      if (s.id !== lastShift) { lastShift = s.id; toast(`${s.icon} ${s.name} shift has started`, 'info', 6000); paintShifts(); updateBadges(); }
    }
  }, 1000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>

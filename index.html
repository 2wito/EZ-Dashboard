];
const LEVEL_TEXT = { ok: 'Healthy', warn: 'In progress', bad: 'Failed checks' };
function mxKey(r, c) { return `${r}-${c}`; }
function mxGet(r, c) { return state.matrix[mxKey(r, c)] || 0; }
function mxSet(r, c, v) { if (v) state.matrix[mxKey(r, c)] = v; else delete state.matrix[mxKey(r, c)]; }
function matrixTotals() {
  let done = 0, failed = 0;
  SITE.customers.forEach((_, r) => SITE.checklistColumns.forEach((_, c) => { const v = mxGet(r, c); if (v === 1) done++; else if (v === 2) failed++; }));
  const total = SITE.customers.length * SITE.checklistColumns.length;
  return { total, done, failed, open: total - done - failed, pct: total ? Math.round(done / total * 100) : 0 };
}
function customerStatuses() {
  return SITE.customers.map((c, r) => {
    const vals = SITE.checklistColumns.map((_, ci) => mxGet(r, ci));
    const issues = SITE.checklistColumns.filter((_, ci) => vals[ci] === 2).map(k => k.label);
    const open = SITE.checklistColumns.filter((_, ci) => vals[ci] === 0).map(k => k.label);
    const done = vals.filter(v => v === 1).length;
    const level = issues.length ? 'bad' : done === vals.length ? 'ok' : 'warn';
    return { customer: c, index: r, issues, open, done, total: vals.length, level };
  });
}

function highlight(text, q) {

// --- 16. Reminders & Interval Timers (WebAudio triple-beep, toasts, sidebar countdowns) ---
let audioCtx = null;
function getAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { audioCtx = null; }
  return audioCtx;
}
function tripleBeep() {
  const ctx = getAudio();
  if (!ctx) return;
  const start = ctx.currentTime + 0.03;
  for (let i = 0; i < 3; i++) {
    const t = start + i * 0.22;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1046.5, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    gain.gain.setValueAtTime(0.3, t + 0.11);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.17);
  }
}
function fmtTime(ms) { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtCountdown(ms) {
  const s = Math.max(0, Math.round((ms - Date.now()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `in ${h}h ${m}m` : m ? `in ${m}m ${pad(sec)}s` : `in ${sec}s`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.round((ms - Date.now()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}
function repeatLabel(min) { return min >= 60 ? `${min / 60}h` : `${min}m`; }
function saveReminders() { store.set('reminders', state.reminders); paintReminders(); updateBadges(); }
function addReminder(text, at, repeat = 0) {
  state.reminders.push({ id: uid(), text, at, from: Date.now(), repeat, fired: false });
  saveReminders();
  toast(`Reminder set for ${fmtTime(at)}${repeat ? ` · repeats every ${repeatLabel(repeat)}` : ''}`, 'ok');
}
function snoozeReminder(id, min) {
  const r = state.reminders.find(x => x.id === id);
  if (!r) return;
  const at = Date.now() + min * 60000;
  if (r.repeat) state.reminders.push({ id: uid(), text: `${r.text} (snoozed)`, at, from: Date.now(), repeat: 0, fired: false });
  else Object.assign(r, { at, from: Date.now(), fired: false });
  saveReminders();
  toast(`Snoozed ${min}m — back at ${fmtTime(at)}`);
}
function renderReminders() {
  $('#sec-reminders').innerHTML = `
    <div class="section-head"><div><h2>Reminders & Timers</h2><p>One-off reminders or repeating interval timers. Triple-beep + toast when due; next timers count down in the sidebar.</p></div></div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title"><h3>New reminder</h3></div>
        <form id="remForm" class="grid">
          <div class="field"><label for="remText">What</label><input id="remText" required maxlength="120" placeholder="Re-run Dominion health check"></div>
          <div class="form-grid">
            <div class="field"><label for="remIn">In minutes</label><input id="remIn" type="number" min="1" max="1440" placeholder="15"></div>
            <div class="field"><label for="remAt">…or at time</label><input id="remAt" type="time"></div>
            <div class="field full"><label for="remRepeat">Repeat</label>
              <select id="remRepeat">${SITE.reminderRepeats.map(m => `<option value="${m}">${m ? `Every ${repeatLabel(m)}` : 'Once'}</option>`).join('')}</select></div>
          </div>
          <div class="row"><span class="small muted">Quick:</span>${[5, 15, 30, 60].map(m => `<button class="btn sm" type="button" data-quick="${m}">+${m}m</button>`).join('')}</div>

  $('#remTest').addEventListener('click', () => { tripleBeep(); toast('This is what a reminder sounds like'); });

function paintReminders() {

      </li>`).join('') : `<li class="empty">Nothing scheduled.</li>`;

let sideTimerKey = '';
function paintSideTimers(force = false) {
  const el = $('#sideTimers');
  const up = state.reminders.filter(r => !r.fired).sort((a, b) => a.at - b.at).slice(0, 3);
  const key = up.map(r => `${r.id}:${r.at}`).join('|');
  if (force || key !== sideTimerKey) {
    sideTimerKey = key;
    el.hidden = !up.length;
    el.innerHTML = up.length ? `<div class="nav-group-label">Timers</div>${up.map(r => `
      <button class="side-timer" type="button" data-st="${esc(r.id)}" title="${esc(r.text)}">

        <span class="st-bar"><span></span></span>
      </button>`).join('')}` : '';
  }
  up.forEach(r => {
    const btn = $(`[data-st="${CSS.escape(r.id)}"]`, el);
    if (!btn) return;
    const left = r.at - Date.now();
    const span = Math.max(r.at - (r.from || r.at), 1);
    btn.querySelector('.st-cd').textContent = fmtClock(r.at);
    btn.querySelector('.st-bar span').style.width = `${Math.min(100, Math.max(0, (1 - left / span) * 100))}%`;
    btn.classList.toggle('soon', left <= 60000);

}
function fireReminder(r) {
  tripleBeep();
  toast(`Reminder: ${r.text}`, 'warn', 0, [{ label: 'Snooze 5m', run: () => snoozeReminder(r.id, 5) }]);
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { new Notification(SITE.name, { body: r.text }); } catch { /* ignore */ }
  }
  if (r.repeat > 0) {
    const step = r.repeat * 60000;
    while (r.at <= Date.now()) r.at += step;
    r.from = r.at - step;
  } else {
    r.fired = true;
  }
}
function checkReminders() {
  let changed = false;
  state.reminders.forEach(r => { if (!r.fired && r.at <= Date.now()) { fireReminder(r); changed = true; } });
  if (changed) { saveReminders(); return; }
  state.reminders.forEach(r => {
    if (r.fired) return;
    const el = $(`[data-cd="${CSS.escape(r.id)}"]`);
    if (el) el.textContent = fmtCountdown(r.at);

}

// --- 17. Games: 2048 & Memory Match ---
let g2048 = store.get('g2048', null);
function new2048() {
  g2048 = { cells: Array(16).fill(0), score: 0, over: false, won: false };
  spawnTile(); spawnTile(); save2048(); render2048();
}
function spawnTile() {
  const empty = g2048.cells.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (!empty.length) return -1;
  const i = empty[Math.floor(Math.random() * empty.length)];
  g2048.cells[i] = Math.random() < 0.9 ? 2 : 4;
  return i;
}
function lineIdx(dir, n) {
  const idx = [0, 1, 2, 3].map(k => dir === 'left' || dir === 'right' ? n * 4 + k : k * 4 + n);
  return dir === 'right' || dir === 'down' ? idx.reverse() : idx;
}
function move2048(dir) {
  if (!g2048 || g2048.over) return;
  let moved = false, gained = 0;
  for (let n = 0; n < 4; n++) {
    const idx = lineIdx(dir, n);
    const vals = idx.map(i => g2048.cells[i]).filter(Boolean);
    const out = [];
    for (let i = 0; i < vals.length; i++) {
      if (vals[i] === vals[i + 1]) { out.push(vals[i] * 2); gained += vals[i] * 2; i++; }
      else out.push(vals[i]);
    }
    while (out.length < 4) out.push(0);
    idx.forEach((ci, k) => { if (g2048.cells[ci] !== out[k]) moved = true; g2048.cells[ci] = out[k]; });
  }
  if (!moved) return;
  g2048.score += gained;
  const spawned = spawnTile();
  const best = Math.max(store.get('g2048best', 0), g2048.score);
  store.set('g2048best', best);
  if (!g2048.won && g2048.cells.includes(2048)) { g2048.won = true; toast('2048! You absolute legend.', 'ok'); }
  if (!canMove()) { g2048.over = true; toast(`Game over — score ${g2048.score}`, 'bad'); }
  save2048(); render2048(spawned);
}
function canMove() {
  const c = g2048.cells;
  for (let i = 0; i < 16; i++) {
    if (!c[i]) return true;
    if (i % 4 < 3 && c[i] === c[i + 1]) return true;
    if (i < 12 && c[i] === c[i + 4]) return true;
  }
  return false;
}
function save2048() { store.set('g2048', g2048); }
function tileStyle(v) {
  if (!v) return '';
  const lvl = Math.min(Math.log2(v), 11);
  const mix = Math.round(lvl / 11 * 100);
  const color = `color-mix(in srgb, var(--accent-2) ${mix}%, var(--accent))`;
  const alpha = 15 + lvl * 7;
  return `background:color-mix(in srgb, ${color} ${alpha}%, var(--surface-2));color:${lvl > 5 ? '#fff' : 'var(--text)'};${v >= 128 ? `box-shadow:0 0 ${lvl * 2}px color-mix(in srgb, ${color} 60%, transparent);` : ''}`;
}
function render2048(popIdx = -1) {
  const board = $('#g2048');
  if (!board || !g2048) return;
  board.innerHTML = g2048.cells.map((v, i) => `<div class="${i === popIdx ? 'pop' : ''}" style="${tileStyle(v)}">${v || ''}</div>`).join('');
  $('#g2048score').textContent = g2048.score;
  $('#g2048best').textContent = store.get('g2048best', 0);
  $('#g2048state').textContent = g2048.over ? 'Game over' : g2048.won ? 'You hit 2048 — keep going!' : 'Arrow keys / WASD / swipe';
}

let mem = null, memLock = false;
function newMemory() {
  const deck = [...SITE.memoryIcons, ...SITE.memoryIcons].map(icon => ({ icon, state: 'down' }));
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  mem = { deck, moves: 0, open: [], start: null };
  memLock = false;
  renderMemory();
}
function renderMemory() {
  $('#memBoard').innerHTML = mem.deck.map((c, i) => `
    <button type="button" class="mem-card ${c.state === 'up' ? 'flip' : ''} ${c.state === 'match' ? 'match' : ''}" data-mem="${i}" aria-label="${c.state === 'down' ? 'Hidden card' : esc(BRANDS[c.icon] ? BRANDS[c.icon].name : c.icon)}">
      <span class="mem-inner"><span class="mem-face mem-back">K</span><span class="mem-face mem-front">${mark(c.icon)}</span></span>
    </button>`).join('');
  $('#memMoves').textContent = mem.moves;
  $('#memPairs').textContent = `${mem.deck.filter(c => c.state === 'match').length / 2}/${SITE.memoryIcons.length}`;
  const best = store.get('memBest', null);
  $('#memBest').textContent = best ?? '—';
}
function flipMemory(i) {
  const c = mem.deck[i];
  if (memLock || !c || c.state !== 'down') return;
  if (!mem.start) mem.start = Date.now();
  c.state = 'up'; mem.open.push(i);
  if (mem.open.length === 2) {
    mem.moves++;
    const [a, b] = mem.open;
    if (mem.deck[a].icon === mem.deck[b].icon) {
      mem.deck[a].state = mem.deck[b].state = 'match'; mem.open = [];
      if (mem.deck.every(x => x.state === 'match')) {
        const best = store.get('memBest', null);
        if (best === null || mem.moves < best) store.set('memBest', mem.moves);
        const secs = Math.round((Date.now() - mem.start) / 1000);
        toast(`Cleared in ${mem.moves} moves (${secs}s)`, 'ok');
      }
    } else {
      memLock = true;
      setTimeout(() => { mem.deck[a].state = mem.deck[b].state = 'down'; mem.open = []; memLock = false; renderMemory(); }, 750);
    }
  }
  renderMemory();
}
function renderGames() {
  $('#sec-games').innerHTML = `
    <div class="section-head"><div><h2>Break Room</h2><p>Five-minute resets for long shifts. Progress is saved.</p></div></div>
    <div class="grid grid-2">
      <div class="card">

        <div class="score-row"><div class="score"><span>Score</span><b id="g2048score">0</b></div><div class="score"><span>Best</span><b id="g2048best">0</b></div></div>
        <div class="g2048" id="g2048" aria-label="2048 board"></div>
        <p class="small muted" style="text-align:center;margin:10px 0 0" id="g2048state"></p>
      </div>
      <div class="card">
        <div class="card-title"><h3>Memory Match</h3><button class="btn sm" type="button" id="memNew">Shuffle</button></div>
        <div class="score-row"><div class="score"><span>Moves</span><b id="memMoves">0</b></div><div class="score"><span>Pairs</span><b id="memPairs">0</b></div><div class="score"><span>Best</span><b id="memBest">—</b></div></div>
        <div class="mem" id="memBoard"></div>
      </div>
    </div>`;
  $('#g2048new').addEventListener('click', new2048);
  $('#memNew').addEventListener('click', newMemory);
  $('#memBoard').addEventListener('click', e => { const b = e.target.closest('[data-mem]'); if (b) flipMemory(+b.dataset.mem); });
  let touch = null;
  const board = $('#g2048');
  board.addEventListener('touchstart', e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  board.addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move2048(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  if (!g2048 || !Array.isArray(g2048.cells) || g2048.cells.length !== 16) new2048(); else render2048();
  newMemory();
}

// --- 18b. Support Desk (ticket queue, conversation workspace, customer panel) ---
const SD_STATUS = {
  open: { label: 'Open', cls: 'info' },
  in_progress: { label: 'In progress', cls: 'warn' },
  escalated: { label: 'Escalated', cls: 'bad' },
  resolved: { label: 'Resolved', cls: 'ok' }
};
const SD_PRIORITY = { urgent: { label: 'Urgent', rank: 0 }, high: { label: 'High', rank: 1 }, normal: { label: 'Normal', rank: 2 }, low: { label: 'Low', rank: 3 } };
const SD_VIEWS = [{ id: 'all', label: 'All' }, { id: 'mine', label: 'Mine' }, { id: 'urgent', label: 'Urgent' }, { id: 'unassigned', label: 'Unassigned' }];
const SD_FILTERS = [['active', 'Active'], ['open', 'Open'], ['in_progress', 'In progress'], ['escalated', 'Escalated'], ['resolved', 'Resolved'], ['all', 'All']];
const SD_CHANNEL_ICON = { email: 'mail', chat: 'chat', phone: 'phone' };
const SD_MIN = 60000;
let sdDraftTimer = null;

function seedSupport() {
  const now = Date.now();
  const at = m => now - m * SD_MIN;
  return {
    tickets: SITE.support.tickets.map(t => ({
      id: t.id, customer: t.customer, subject: t.subject, priority: t.priority, status: t.status, channel: t.channel,
      tags: t.tags.slice(), assignee: t.assignee ?? null, createdAt: at(t.ageMin),
      slaDueAt: t.slaInMin == null ? null : now + t.slaInMin * SD_MIN,
      unread: !!t.unread,
      slaWarned: t.slaInMin != null && t.slaInMin < 0, // already breached at seed time — no toast
      thread: t.thread.map((e, i) => ({ id: `${t.id}-${i}`, kind: e.kind, author: e.author || 'System', body: e.body, at: at(e.agoMin) }))
    })),
    selected: SITE.support.tickets[0] ? SITE.support.tickets[0].id : null,
    view: 'all', filter: 'active', sort: 'priority', query: '', drafts: {}
  };
}
function sdValid(v) {
  return !!v && Array.isArray(v.tickets) && v.tickets.length > 0 &&
    v.tickets.every(t => t && typeof t.id === 'string' && SD_STATUS[t.status] && SD_PRIORITY[t.priority] && Array.isArray(t.thread)) &&
    v.drafts && typeof v.drafts === 'object';
}
function sdSave() { store.set('supportV1', state.support); }
function sdCustomer(id) {
  return SITE.customers.find(c => c.id === id) || { id, name: id, persona: id, tier: '—', platforms: [], manager: '—' };
}
function sdTicket(id) { return state.support ? state.support.tickets.find(t => t.id === id) || null : null; }
function sdLast(t) { return t.thread.length ? t.thread[t.thread.length - 1].at : t.createdAt; }
function sdAgo(ts) {
  const m = Math.floor(Math.max(0, Date.now() - ts) / SD_MIN);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
}
function sdDuration(m) { return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`; }
function sdSla(t) {
  if (t.slaDueAt == null || t.status === 'resolved') return null;
  const diff = t.slaDueAt - Date.now();
  const m = Math.round(Math.abs(diff) / SD_MIN);
  return diff < 0
    ? { label: `SLA breached ${sdDuration(m)}`, cls: 'bad', breached: true }
    : { label: `SLA ${sdDuration(m)}`, cls: m <= 15 ? 'bad' : '', breached: false };
}
function sdInitials(name) { return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join(''); }
function sdAvatar(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `<span class="sd-avatar" style="--h:${h}" aria-hidden="true">${esc(sdInitials(name))}</span>`;
}
function sdMatchesView(t, view) {
  if (view === 'mine') return t.assignee === SITE.support.agent;
  if (view === 'urgent') return t.priority === 'urgent' || t.status === 'escalated';
  if (view === 'unassigned') return !t.assignee;
  return true;
}
function sdActiveCount() { return state.support ? state.support.tickets.filter(t => t.status !== 'resolved').length : 0; }
function sdBreachedCount() { return state.support ? state.support.tickets.filter(t => { const s = sdSla(t); return s && s.breached; }).length : 0; }
function sdVisible() {
  const s = state.support;
  const q = s.query.trim().toLowerCase();
  return s.tickets
    .filter(t => sdMatchesView(t, s.view))
    .filter(t => s.filter === 'all' || (s.filter === 'active' ? t.status !== 'resolved' : t.status === s.filter))
    .filter(t => {
      if (!q) return true;
      const c = sdCustomer(t.customer);
      return `${t.id} ${t.subject} ${t.tags.join(' ')} ${c.name} ${c.persona}`.toLowerCase().includes(q);
    })
    .sort((a, b) => (s.sort === 'priority' ? SD_PRIORITY[a.priority].rank - SD_PRIORITY[b.priority].rank : 0) || sdLast(b) - sdLast(a));
}
function sdFill(body, t) {
  const c = sdCustomer(t.customer);
  const vars = { name: String(c.persona).split(' ')[0], customer: c.name, agent: SITE.support.agent, ticket: t.id };
  return body.replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
}
function sdSpark(values, color, kind) {
  const w = 104, h = 36, n = values.length;
  const min = kind === 'bar' ? 0 : Math.min(...values), max = Math.max(...values);
  const y = v => h - 2 - ((v - min) / ((max - min) || 1)) * (h - 4);
  if (kind === 'bar') {
    const bw = w / n;
    return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${values.map((v, i) =>
      `<rect x="${(i * bw + bw * .15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * .7).toFixed(1)}" height="${(h - 2 - y(v)).toFixed(1)}" rx="1.5" fill="${color}" opacity="${i === n - 1 ? 1 : .4}"/>`).join('')}</svg>`;
  }
  const pts = values.map((v, i) => `${(i * w / (n - 1)).toFixed(1)},${y(v).toFixed(1)}`);
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="0,${h} ${pts.join(' ')} ${w},${h}" fill="${color}" opacity=".14"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[n - 1].split(',')[0]}" cy="${pts[n - 1].split(',')[1]}" r="2.6" fill="${color}"/></svg>`;
}

// Unbiased crypto-random integer in [0, max)
function rndInt(max) {
  if (max <= 1) return 0;
  const lim = Math.floor(0x100000000 / max) * max, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % max;
}
function pick(arr) { return arr[rndInt(arr.length)]; }
function fillPattern(p) { return String(p).replace(/#/g, () => rndInt(10)).replace(/@/g, () => 'ABCDEFGHJKLMNPRSTUWXYZ'[rndInt(22)]); }
function uuid4() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function randomFrom(chars, n) { let s = ''; for (let i = 0; i < n; i++) s += chars[rndInt(chars.length)]; return s; }
function fmtCard(n) { return n.length === 15 ? `${n.slice(0, 4)} ${n.slice(4, 10)} ${n.slice(10)}` : n.replace(/(\d{4})(?=\d)/g, '$1 '); }
const QA_PWD_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';

function fakePerson(locKey) {
  const Q = SITE.qa, L = Q.locales[locKey] || Q.locales.US;
  const first = pick(L.first), last = pick(L.last);
  const [city, zipPat] = pick(L.cities);
  const card = pick(Q.testCards);
  const age = 18 + rndInt(58);
  const dob = new Date(Date.UTC(new Date().getFullYear() - age, rndInt(12), 1 + rndInt(28)));
  const exp = new Date(); exp.setMonth(exp.getMonth() + 6 + rndInt(48));
  const handle = `${first}.${last}`.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z.]/g, '').toLowerCase();
  return {
    name: `${first} ${last}`,
    email: `${handle}${rndInt(90) + 10}@${pick(Q.emailDomains)}`,
    phone: fillPattern(L.phone),
    username: `${handle.replace('.', '_')}${rndInt(900) + 100}`,
    password: randomFrom(QA_PWD_CHARS, 14),
    dob: dob.toISOString().slice(0, 10),
    address: L.addr.replace('{n}', 1 + rndInt(240)).replace('{street}', pick(L.streets)),
    city, zip: fillPattern(zipPat), country: L.country,
    company: pick(Q.companies), job: pick(Q.jobs),
    cardBrand: card.brand, card: fmtCard(card.number),
    cardExp: `${pad(exp.getMonth() + 1)}/${String(exp.getFullYear()).slice(2)}`,
    cvv: fillPattern(card.number.length === 15 ? '####' : '###'),
    ip: `${pick(['192.0.2', '198.51.100', '203.0.113'])}.${1 + rndInt(254)}`,
    id: uuid4()
  };
}

    SITE.qa.checklist.forEach((g, gi) => { lines.push(`*${g.group}*`); g.items.forEach((it, ii) => lines.push(`${QA_MARKS[qa.checks[`${gi}-${ii}`] || 0].slack} ${it}`)); lines.push(''); });
    if (open.length) { lines.push(`*Open bugs (${open.length})*`); open.forEach(x => lines.push(`• \`${x.id}\` [${sevLabel(x.severity)}] ${x.title}`)); }
    if (m.notes.trim()) lines.push('', `_Notes:_ ${m.notes.trim()}`);
  } else {
    lines.push(`=== ${head.toUpperCase()} ===`, `Environment: ${m.env} | Platform: ${m.platform} | Tester: ${m.tester || '—'} | ${date}`, `Result: ${qaVerdict(t)} — ${stats}`, '');
    SITE.qa.checklist.forEach((g, gi) => { lines.push(`[${g.group}]`); g.items.forEach((it, ii) => lines.push(`  ${QA_MARKS[qa.checks[`${gi}-${ii}`] || 0].sym} ${it}`)); });
    if (open.length) { lines.push('', `OPEN BUGS (${open.length})`); open.forEach(x => lines.push(`  - ${x.id} [${sevLabel(x.severity)}] ${x.title}`)); }
    if (m.notes.trim()) lines.push('', `Notes: ${m.notes.trim()}`);
  }

}

}

// ---- tool behaviour ----
const TOOL_INIT = {
  password(card) {
    const gen = () => {
      const sets = [];
      const amb = $('#pwAmbig', card).checked;
      const strip = s => amb ? s.replace(/[Il1O0o|]/g, '') : s;
      if ($('#pwUpper', card).checked) sets.push(strip('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));
      if ($('#pwLower', card).checked) sets.push(strip('abcdefghijklmnopqrstuvwxyz'));
      if ($('#pwDigits', card).checked) sets.push(strip('0123456789'));
      if ($('#pwSymbols', card).checked) sets.push('!@#$%^&*()-_=+[]{};:,.?/');
      const len = +$('#pwLen', card).value;
      $('#pwLenOut', card).textContent = len;
      if (!sets.length) { $('#pwOut', card).textContent = 'Pick at least one character set'; return; }
      const all = sets.join('');
      // one from each set, rest from the pool, then crypto-shuffle
      const chars = sets.map(s => s[rndInt(s.length)]);
      while (chars.length < len) chars.push(all[rndInt(all.length)]);
      for (let i = chars.length - 1; i > 0; i--) { const j = rndInt(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
      const pw = chars.join('');
      const bits = Math.round(len * Math.log2(all.length));
      const lvl = bits < 50 ? ['Weak', 'bad', 25] : bits < 80 ? ['Fair', 'warn', 55] : bits < 110 ? ['Strong', 'ok', 80] : ['Very strong', 'ok', 100];
      $('#pwOut', card).textContent = pw;
      $('#pwMeter', card).style.width = `${lvl[2]}%`;
      $('#pwMeter', card).className = lvl[1];
      $('#pwInfo', card).textContent = `${bits} bits of entropy · ${lvl[0]}`;
    };
    card.addEventListener('input', e => { if (e.target.matches('input')) gen(); });
    $('#pwNew', card).addEventListener('click', gen);
    $('#pwCopy', card).addEventListener('click', () => copyText($('#pwOut', card).textContent, 'Password copied'));
    gen();
  },
  token(card) {
    const one = t => {
      const bytes = n => crypto.getRandomValues(new Uint8Array(n));
      if (t === 'uuid') return uuid4();
      if (t === 'hex32') return toHex(bytes(32));
      if (t === 'hex16') return toHex(bytes(16));
      if (t === 'b64') return b64e(bytes(32)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (t === 'api') return `sk_test_${randomFrom('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', 32)}`;
      return String(rndInt(1000000)).padStart(6, '0');
    };
    const gen = () => {
      const t = $('#tkType', card).value, n = +$('#tkCount', card).value;
      $('#tkOut', card).innerHTML = Array.from({ length: n }, () => one(t)).map(v => `<button type="button" class="t-v mono" data-copy="${esc(v)}">${esc(v)}</button>`).join('');
    };
    $('#tkGen', card).addEventListener('click', gen);
    $('#tkType', card).addEventListener('change', gen);
    $('#tkCount', card).addEventListener('change', gen);
    gen();
  },
  hash(card) {
    const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
    let last = {}, timer = null;
    const verify = () => {
      const want = $('#hVerify', card).value.trim().toLowerCase();
      const hit = want && Object.entries(last).find(([, h]) => h === want);
      $('#hVerifyOut', card).innerHTML = !want ? '' : hit
        ? `<span class="status ok">Match · ${esc(hit[0])}</span>` : `<span class="status bad">No match</span>`;
    };
    const run = async data => {
      if (!crypto.subtle) { $('#hOut', card).innerHTML = '<div class="small muted">Web Crypto needs HTTPS or localhost.</div>'; return; }
      const out = {};
      for (const a of algos) out[a] = toHex(await crypto.subtle.digest(a, data));
      last = out;
      $('#hOut', card).innerHTML = algos.map(a => outRow(a, out[a])).join('');
      verify();
    };
    $('#hInput', card).addEventListener('input', () => {
      clearTimeout(timer);
      $('#hFileName', card).textContent = '';
      timer = setTimeout(() => run(utf8.encode($('#hInput', card).value)), 150);
    });
    $('#hFile', card).addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      $('#hFileName', card).textContent = `${f.name} · ${fmtNum(f.size / 1048576, 2)} MB`;
      run(await f.arrayBuffer());
    });
    $('#hVerify', card).addEventListener('input', verify);
    run(utf8.encode(''));
  },
  aes(card) {
    const key = async (pass, salt) => {
      const base = await crypto.subtle.importKey('raw', utf8.encode(pass), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    };
    const pass = () => { const p = $('#aesPass', card).value; if (!p) toast('Enter a passphrase first', 'warn'); return p; };
    $('#aesEnc', card).addEventListener('click', async () => {
      const p = pass(); if (!p) return;
      const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(p, salt), utf8.encode($('#aesIn', card).value)));
      const all = new Uint8Array(28 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28);
      $('#aesOut', card).value = b64e(all);
    });
    $('#aesDec', card).addEventListener('click', async () => {
      const p = pass(); if (!p) return;
      try {
        const all = b64d($('#aesIn', card).value.trim());
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(16, 28) }, await key(p, all.slice(0, 16)), all.slice(28));
        $('#aesOut', card).value = utf8d.decode(pt);
      } catch { $('#aesOut', card).value = ''; toast('Could not decrypt — wrong passphrase or damaged text', 'warn'); }
    });
    $('#aesCopy', card).addEventListener('click', () => copyText($('#aesOut', card).value, 'Copied'));
  },

  SITE.tools.forEach(t => { const card = $(`#tool-${CSS.escape(t.id)}`); if (TOOL_INIT[t.id]) TOOL_INIT[t.id](card); });
  filterTools();
}
function filterTools() {
  const q = ($('#toolSearch')?.value || '').toLowerCase().trim();
  let shown = 0;
  SITE.tools.forEach(t => {
    const ok = (toolCat === 'All' || t.cat === toolCat) && (!q || `${t.title} ${t.desc} ${t.cat}`.toLowerCase().includes(q));
    $(`#tool-${CSS.escape(t.id)}`).hidden = !ok;
    if (ok) shown++;
  });
  $('#toolEmpty').hidden = shown > 0;
}
function openTool(id) {
  showSection('tools');
  if (toolCat !== 'All') { toolCat = 'All'; store.set('toolCat', 'All'); $$('#toolCats .tab').forEach(t => t.classList.toggle('active', t.dataset.tcat === 'All')); }
  $('#toolSearch').value = ''; filterTools();
  const el = $(`#tool-${CSS.escape(id)}`);
  if (el) setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); }, 250);
}

// --- 19. Command Palette (Ctrl+K) ---
let palItems = [], palSel = 0, palIndex = null;
function paletteIndex() {
  const items = [];
  ALL_SECTIONS.forEach(s => items.push({ type: 'Section', label: s.label, sub: 'go to', run: () => showSection(s.id) }));
  SITE.shortcuts.forEach(sc => items.push({ type: 'Shortcut', label: sc.label, sub: sc.keys, kbd: true, run: () => ACTIONS[sc.action] && ACTIONS[sc.action]() }));
  SITE.customers.forEach(c => items.push({ type: 'Customer', label: c.name, sub: `${c.domain} · ${c.platforms.join(' / ')} · TAM ${c.manager}`, run: () => showSection('customers') }));
  (state.support ? state.support.tickets : []).forEach(t => items.push({ type: 'Ticket', label: t.subject, sub: `${t.id} · ${sdCustomer(t.customer).name} · ${SD_STATUS[t.status].label}`, run: () => { showSection('support'); sdSelect(t.id); } }));
  SITE.templates.forEach(t => items.push({ type: 'Template', label: t.title, sub: 'copy', run: () => copyTemplate(t.id) }));
  SITE.linkGroups.forEach(g => g.items.forEach(l => items.push({ type: 'Link', label: l.name, sub: `${g.group} · ${l.desc}`, run: () => window.open(safeUrl(l.url), '_blank', 'noopener') })));
  SITE.docs.forEach(d => items.push({ type: 'Doc', label: d.title, sub: d.cat, run: () => window.open(safeUrl(d.url), '_blank', 'noopener') }));
  SITE.commands.forEach(g => g.items.forEach(c => items.push({ type: 'Command', label: c.cmd, sub: g.group, mono: true, run: () => copyText(c.cmd, 'Command copied') })));
  Object.entries(SITE.themes).forEach(([id, label]) => items.push({ type: 'Theme', label: `Theme: ${label}`, sub: '', run: () => { $('#themeSelect').value = id; applyTheme(id); } }));
  SITE.tools.forEach(t => items.push({ type: 'Tool', label: t.title, sub: `${t.cat} · ${t.desc}`, run: () => openTool(t.id) }));
  (qa ? qa.tickets : []).forEach(t => items.push({ type: 'Bug', label: t.title, sub: `${t.id} · ${t.status}`, run: () => showSection('qa') }));
  items.push({ type: 'Action', label: 'Generate test data', sub: 'QA Lab', run: () => { showSection('qa'); $('#qaGenerate').click(); } });
  items.push({ type: 'Action', label: 'Copy QA report message', sub: 'QA Lab', run: () => copyText(qaMessage(), 'QA report copied') });
  items.push({ type: 'Action', label: 'Generate shift handoff', sub: '', run: () => { showSection('shifts'); $('#hoGen').click(); } });
  items.push({ type: 'Action', label: 'Generate checklist report', sub: '', run: () => { showSection('customers'); $('#mxReport').click(); } });
  items.push({ type: 'Action', label: 'Export environments to Excel', sub: '', run: exportExcel });
  items.push({ type: 'Action', label: 'Reset Support Desk demo data', sub: '', run: () => { showSection('support'); sdReset(); } });
  return items;
}
function openPalette() {
  palIndex = paletteIndex(); // rebuilt per open so it reflects current config/state
  $('#paletteOverlay').classList.add('open');
  const inp = $('#paletteInput');
  inp.value = '';
  palSel = 0;
  filterPalette();
  inp.focus(); // synchronous so keystrokes typed right after Ctrl+K are not lost
}
function closePalette() { $('#paletteOverlay').classList.remove('open'); }
function isPaletteOpen() { return $('#paletteOverlay').classList.contains('open'); }
function filterPalette() {
  const words = $('#paletteInput').value.toLowerCase().split(/\s+/).filter(Boolean);
  const all = palIndex || paletteIndex();
  palItems = (words.length
    ? all.filter(it => { const hay = `${it.type} ${it.label} ${it.sub}`.toLowerCase(); return words.every(w => hay.includes(w)); })
    : all).slice(0, 50);
  palSel = Math.min(palSel, Math.max(palItems.length - 1, 0));
  $('#paletteList').innerHTML = palItems.length ? palItems.map((it, i) => `
    <li class="pal-item ${i === palSel ? 'sel' : ''}" data-pi="${i}" id="pal-${i}" role="option" aria-selected="${i === palSel}">
      <span class="pal-type">${esc(it.type)}</span>
      <span class="pal-label" ${it.mono ? 'style="font-family:var(--font-mono);font-size:13px"' : ''}>${esc(it.label)}</span>
      <span class="pal-sub">${it.kbd ? `<kbd>${esc(it.sub)}</kbd>` : esc(it.sub)}</span>
    </li>`).join('') : `<li class="empty" style="margin:8px">No results</li>`;
  $('#paletteInput').setAttribute('aria-activedescendant', palItems.length ? `pal-${palSel}` : '');
  const sel = $('.pal-item.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
function runPalette(i) {
  const it = palItems[i];
  if (!it) return;
  closePalette();
  it.run();
}
function initPalette() {
  const inp = $('#paletteInput');
  inp.setAttribute('role', 'combobox');
  inp.setAttribute('aria-controls', 'paletteList');
  inp.setAttribute('aria-expanded', 'true');
  inp.addEventListener('input', () => { palSel = 0; filterPalette(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % Math.max(palItems.length, 1); filterPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + palItems.length) % Math.max(palItems.length, 1); filterPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(palSel); }
  });
  $('#paletteList').addEventListener('click', e => { const li = e.target.closest('[data-pi]'); if (li) runPalette(+li.dataset.pi); });
  $('#paletteList').addEventListener('mousemove', e => {
    const li = e.target.closest('[data-pi]');
    if (!li || +li.dataset.pi === palSel) return;
    $$('.pal-item.sel').forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-selected', 'false'); });
    palSel = +li.dataset.pi;
    li.classList.add('sel'); li.setAttribute('aria-selected', 'true');
  });
  $('#paletteOverlay').addEventListener('click', e => { if (e.target.id === 'paletteOverlay') closePalette(); });
  $('#paletteHint').addEventListener('click', openPalette);
  $('#topSearch').addEventListener('click', openPalette);
}

// --- 20. Floating Scratchpad (draggable, resizable, autosaved) ---
let scratchTimer = null, scratchGeomTimer = null;
function scratchEl() { return $('#scratch'); }
function clampGeom(g) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(Math.max(g.w, 260), vw - 16);
  const h = Math.min(Math.max(g.h, 200), vh - 16);
  return { w, h, x: Math.min(Math.max(g.x, 8), vw - w - 8), y: Math.min(Math.max(g.y, 8), vh - h - 8) };
}
function applyGeom(g) {
  const el = scratchEl();
  Object.assign(el.style, { left: `${g.x}px`, top: `${g.y}px`, width: `${g.w}px`, height: `${g.h}px`, right: 'auto', bottom: 'auto' });
}
function currentGeom() {
  // offset* = untransformed layout box (getBoundingClientRect would include the open animation's scale)
  const el = scratchEl();
  return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
}
function resetScratchGeom() {
  const el = scratchEl();
  ['left', 'top', 'width', 'height', 'right', 'bottom'].forEach(k => { el.style[k] = ''; });
  store.set('scratchGeom', null);
  applyGeom(clampGeom(currentGeom())); // re-anchor to top/left so CSS resize grows toward the handle
}
function toggleScratch(force) {
  const el = scratchEl();
  const open = typeof force === 'boolean' ? force : !el.classList.contains('open');
  el.classList.toggle('open', open);
  store.set('scratchOpen', open);
  if (!open) return;
  const saved = store.get('scratchGeom', null);
  if (saved) applyGeom(clampGeom(saved)); else applyGeom(clampGeom(currentGeom()));
  setTimeout(() => $('#scratchText').focus(), 20);
}
function initScratch() {
  const el = scratchEl(), ta = $('#scratchText'), head = $('.scratch-head', el);
  ta.value = state.scratch;
  ta.addEventListener('input', () => {
    $('#scratchStatus').textContent = 'Saving…';
    clearTimeout(scratchTimer);
    scratchTimer = setTimeout(() => {
      state.scratch = ta.value;
      store.set('scratch', ta.value);
      $('#scratchStatus').textContent = `Saved ${fmtTime(Date.now())} · ${ta.value.length} chars`;
    }, 400);
  });

  let drag = null;
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    const g = currentGeom();
    drag = { dx: e.clientX - g.x, dy: e.clientY - g.y, w: g.w, h: g.h };
    head.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  head.addEventListener('pointermove', e => {
    if (!drag) return;
    applyGeom(clampGeom({ x: e.clientX - drag.dx, y: e.clientY - drag.dy, w: drag.w, h: drag.h }));
  });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    el.classList.remove('dragging');
    store.set('scratchGeom', currentGeom());
  };
  head.addEventListener('pointerup', endDrag);
  head.addEventListener('pointercancel', endDrag);
  head.addEventListener('dblclick', e => { if (!e.target.closest('button')) resetScratchGeom(); });

  if ('ResizeObserver' in window) {
    new ResizeObserver(() => {
      if (!el.classList.contains('open') || drag) return;
      clearTimeout(scratchGeomTimer);
      scratchGeomTimer = setTimeout(() => { if (el.style.left) store.set('scratchGeom', currentGeom()); }, 250);
    }).observe(el);
  }
  window.addEventListener('resize', () => { if (el.classList.contains('open')) applyGeom(clampGeom(currentGeom())); });

  $('#scratchFab').addEventListener('click', () => toggleScratch());
  $('#scratchClose').addEventListener('click', () => toggleScratch(false));
  $('#scratchCopy').addEventListener('click', () => copyText(ta.value, 'Scratchpad copied'));
  $('#scratchClear').addEventListener('click', () => {
    if (!ta.value) return;
    const backup = ta.value;
    ta.value = ''; state.scratch = ''; store.set('scratch', '');
    toast('Scratchpad cleared', 'warn', 6000, [{ label: 'Undo', run: () => { ta.value = backup; state.scratch = backup; store.set('scratch', backup); } }]);
  });
  if (store.get('scratchOpen', false)) toggleScratch(true);
}

// --- 21. Keyboard Shortcuts (driven by SITE.shortcuts) ---
const ACTIONS = {
  palette: () => (isPaletteOpen() ? closePalette() : openPalette()),
  scratch: () => toggleScratch(),
  light: () => applyLight(!document.body.classList.contains('light-mode')),
  reminder: () => { showSection('reminders'); setTimeout(() => { const t = $('#remText'); if (t) t.focus(); }, 60); },
  beep: () => { tripleBeep(); toast('Test beep'); },
  search: () => {
    const inp = $('.page-section.active [data-page-search]');
    if (inp) inp.focus(); else openPalette();
  },
  close: () => {
    if (isPaletteOpen()) return closePalette();
    if ($('#lightbox').classList.contains('open')) return closeLightbox();
    if (scratchEl().classList.contains('open')) return toggleScratch(false);
    closeSidebar();
  }
};
function isTyping(e) { const t = e.target; return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
function matchShortcut(e, combo) {
  const parts = combo.split('+');
  const key = parts.pop();
  if ((e.ctrlKey || e.metaKey) !== parts.includes('Ctrl') || e.altKey !== parts.includes('Alt')) return false;
  if (parts.includes('Shift') && !e.shiftKey) return false;
  if (key === 'Esc') return e.key === 'Escape';
  if (/^[A-Z]$/.test(key)) return e.code === `Key${key}`;
  if (/^\d$/.test(key)) return e.code === `Digit${key}`;
  return e.key === key;
}
function initKeys() {
  document.addEventListener('keydown', e => {
    const typing = isTyping(e);
    for (const sc of SITE.shortcuts) {
      if ((sc.global || !typing) && matchShortcut(e, sc.keys)) {
        e.preventDefault();
        if (ACTIONS[sc.action]) ACTIONS[sc.action]();
        return;
      }
    }
    if ($('#lightbox').classList.contains('open')) {
      if (e.key === 'ArrowLeft') openLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight') openLightbox(lbIndex + 1);
      return;
    }
    if (typing || isPaletteOpen()) return;
    if ($('#sec-games').classList.contains('active')) {
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
      const dir = map[e.key];
      if (dir) { e.preventDefault(); move2048(dir); }
    }
    if ($('#sec-support').classList.contains('active') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === 'j' || e.key === 'k') { e.preventDefault(); sdMove(e.key === 'j' ? 1 : -1); }
      else if (e.key === 'r') { e.preventDefault(); const ta = $('#sdText'); if (ta && !$('#sdComposer').hidden) ta.focus(); }
    }
  });
}

// --- 22. Boot ---
function boot() {
  $('#brandName').textContent = SITE.name;
  $('#brandSub').textContent = SITE.tagline;
  $('#topTitle').textContent = SITE.name;
  $('#footNote').textContent = `Data stored locally · ${SITE.storagePrefix}*`;
  document.title = `${SITE.name} — ${SITE.tagline}`;

  renderNav();
  renderClocks();
  renderDashboard();
  renderCustomers();
  renderSupport();
  renderShifts();
  renderTemplates();
  renderEnvironments();
  renderLinks();
  renderDocs();
  renderTerminal();
  renderReminders();
  renderGames();
  renderQA();
  renderTools();
  renderMorale();
  initTheme();
  initPalette();
  initScratch();
  initKeys();

  $('#menuBtn').addEventListener('click', openSidebar);
  $('#scrim').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => {
    const st = e.target.closest && e.target.closest('.stat[data-goto]');
    if (st && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showSection(st.dataset.goto); }
  });
  window.addEventListener('hashchange', () => showSection(location.hash.slice(1)));
  window.addEventListener('storage', e => {
    if (e.key && e.key.startsWith(SITE.storagePrefix)) toast('Data changed in another tab — reload to sync', 'warn');
  });

  showSection(location.hash.slice(1) || currentSection());
  updateBadges();

  let lastShift = currentShift().id;
  setInterval(() => {
    tickClocks();
    checkReminders();
    const now = new Date();
    if (now.getSeconds() === 0) {
      updateHero(); renderStats(); tickSupport(); tickWorldMap();
      const s = currentShift(now);
      if (s.id !== lastShift) { lastShift = s.id; toast(`${s.name} shift has started`, 'info', 6000); paintShifts(); updateBadges(); }
    }
  }, 1000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
